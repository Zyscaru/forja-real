<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jogo de Java avançado: genéricos, records, enums, streams, padrões de projeto, pattern matching e algoritmos no reino medieval.">
<meta name="theme-color" content="#15131a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forja Real">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Forja Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans+SC:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Source+Code+Pro:wght@400;600&display=swap">
<style>
/* Layout: mesa do engenheiro real — ordens e forja (editor) à esquerda, mapa do reino ou pergaminho do conselho à direita.
   Visual único e escuro (salão de pedra à luz de tochas), escolhido de propósito. */
:root{
  color-scheme: dark;
  --bg:#15131a; --panel:#1f1c26; --panel-2:#292532; --ink:#f1e9da; --ink-soft:#b5a991; --line:#3d3647;
  --stone:#3a3542; --stone-hi:#58516a; --stone-lo:#24212b; --floor:#5c5348; --floor-2:#665c50; --grout:rgba(0,0,0,.25);
  --grass:#5f7d3a; --forest:#2f5a35; --swamp:#3f5e58; --tower:#e6b450;
  --key-a:#e6b450; --key-b:#7fc4e8; --key-c:#d58ae0;
  --accent:#c9473f; --accent-ink:#fff4ea; --gold:#e6b450; --mark:#ffe08a;
  --code-bg:#110f15; --code-fg:#efe7d8; --code-dim:#7c7287; --key:#221f2a;
  --ok:#9bd17a; --ok-bg:#1c2a17; --err:#f39a8f; --err-bg:#331816; --star:#e6b450; --star-off:#4a4254;
  --f-display:"Pirata One", "Times New Roman", serif;
  --f-label:"Alegreya Sans SC", "Trebuchet MS", sans-serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-code:"Source Code Pro", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 380px at 80% -140px, #3d2418 0%, transparent 65%), radial-gradient(700px 300px at 0% 0%, #241f33 0%, transparent 70%), var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1340px;margin:0 auto;padding-block:14px 4px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.logo{display:flex;align-items:center;gap:10px;line-height:1;min-width:0}
.logo div{font-family:var(--f-display);font-size:2.1rem;letter-spacing:.02em;white-space:nowrap;color:var(--gold)}
.logo small{display:block;font-family:var(--f-label);font-weight:700;font-size:.72rem;letter-spacing:.14em;color:var(--ink-soft);margin-top:2px}
.logo svg{width:42px;height:42px;flex:none}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
.pill .st{color:var(--star)}
.btn{border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 16px;font-weight:700;font-size:.95rem;min-height:42px;color:var(--ink)}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}

.wrap{max-width:1340px;margin:0 auto;padding-block:10px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"mission board" "editor board";gap:16px;align-items:start}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;min-width:0}
.mission{grid-area:mission;padding:20px 22px}
.boardcard{grid-area:board;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:14px;display:flex;flex-direction:column;gap:10px}
.edcol{grid-area:editor;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-family:var(--f-label);font-weight:700;font-size:.9rem;letter-spacing:.1em;color:var(--gold)}
.eyebrow .num{color:var(--ink-soft);margin-left:6px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.1rem,3.6vw,2.8rem);line-height:1;margin:6px 0 12px;letter-spacing:.01em;text-wrap:balance}
.mission p{margin:0 0 10px;max-width:64ch}
.mission code,.ref code{font-family:var(--f-code);font-size:.8em;background:var(--panel-2);padding:1px 5px;border-radius:4px;color:var(--ink)}
.mission pre{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.78rem;border-radius:6px;padding:10px 14px;margin:0 0 12px;overflow-x:auto;border:1px solid var(--line);border-left:3px solid var(--gold)}
.task{background:linear-gradient(135deg,#3a1c1a,#24141a);border:1.5px solid var(--accent);border-radius:8px;padding:12px 14px;margin:6px 0 4px}
.task strong{display:block;font-family:var(--f-label);letter-spacing:.12em;font-size:.86rem;color:#f08a7f;margin-bottom:4px}
.task p{margin:0}
details.ref{margin-top:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel-2)}
details.ref summary{cursor:pointer;padding:10px 14px;font-family:var(--f-label);font-weight:700;letter-spacing:.08em;font-size:.92rem;color:var(--ink-soft);list-style:none}
details.ref summary::-webkit-details-marker{display:none}
details.ref summary::before{content:"▸ ";color:var(--gold)}
details.ref[open] summary::before{content:"▾ "}
.refbody{padding:0 14px 12px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.refbody pre{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.76rem;border-radius:6px;padding:10px 14px;margin:4px 0 0;overflow-x:auto;border:1px solid var(--line);max-height:360px}
.goal{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--ink-soft);margin-top:10px}
.goal b{color:var(--ink)}

/* editor */
.editor{background:var(--code-bg);border-radius:10px;overflow:hidden;border:1.5px solid var(--line)}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 9px 16px;border-bottom:1px solid var(--line);color:var(--code-dim);font-family:var(--f-code);font-size:.78rem}
.ed-body{display:grid;grid-template-columns:42px 1fr;min-height:280px;max-height:66vh;overflow:auto}
.gutter{padding:12px 8px 12px 0;text-align:right;font-family:var(--f-code);font-size:.84rem;line-height:1.6;color:#4f4759;user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
#code{background:transparent;color:var(--code-fg);border:0;resize:none;outline:none;padding:12px 12px 12px 10px;font-family:var(--f-code);font-size:.84rem;line-height:1.6;white-space:pre;overflow:hidden;tab-size:4;caret-color:var(--gold);min-height:280px;width:100%}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--line);scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:6px;background:var(--key);color:var(--code-fg);font-family:var(--f-code);font-size:.86rem}
.keys button:active{background:var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.speed{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.speed button{border:0;background:var(--panel);padding:8px 10px;font-size:.82rem;font-weight:700;color:var(--ink-soft)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.feedback{border-radius:8px;padding:12px 14px;font-size:.95rem;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err);border:1.5px solid var(--err)}
.feedback b{font-family:var(--f-label);font-size:1.05rem;letter-spacing:.08em}
.feedback .cmp{font-family:var(--f-code);font-size:.8rem;background:rgba(0,0,0,.25);border-radius:6px;padding:8px 10px;color:var(--ink);white-space:pre-wrap}
.feedback .row{display:flex;gap:8px;flex-wrap:wrap}
.feedback .btn{font-size:.88rem;padding:6px 12px;min-height:36px}
.hint{color:var(--ink);background:var(--panel);border-radius:6px;padding:8px 10px;font-size:.9rem;white-space:pre-wrap}
.solution{background:var(--code-bg);color:var(--code-fg);border-radius:6px;padding:10px 12px;font-family:var(--f-code);font-size:.76rem;white-space:pre;overflow-x:auto;margin:0;border:1px solid var(--line);max-height:400px}

/* mapa / pergaminho */
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-family:var(--f-code)}
.bhead b{color:var(--ink)}
.maps{display:flex;gap:6px;flex-wrap:wrap}
.maps button{border:1.5px solid var(--line);background:var(--panel-2);border-radius:6px;padding:3px 9px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.maps button[aria-current="true"]{border-color:var(--ink);color:var(--ink)}
.maps button.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.maps button.bad{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.stage{position:relative;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%, #2c2733 0%, #17151c 80%);border-radius:8px;padding:10px;overflow:hidden;min-height:220px;border:1px solid var(--line)}
.board{position:relative;display:grid;gap:0;max-width:100%}
.cell{width:var(--c);height:var(--c);position:relative}
.cell.w{background:var(--stone-lo);background-image:linear-gradient(var(--stone),var(--stone)),linear-gradient(var(--stone),var(--stone));background-size:46% 44%,46% 44%;background-position:2% 4%,98% 96%;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.cell.w.v2{background-image:linear-gradient(var(--stone-hi),var(--stone-hi)),linear-gradient(var(--stone),var(--stone));background-position:98% 4%,2% 96%}
.cell.f0{background:var(--floor);background-image:linear-gradient(90deg,var(--grout) 1px,transparent 1px),linear-gradient(0deg,var(--grout) 1px,transparent 1px);background-size:50% 50%}
.cell.f0.alt{background-color:var(--floor-2)}
.cell.tg{background:var(--grass);background-image:radial-gradient(circle at 30% 40%,rgba(255,255,255,.12) 0 8%,transparent 9%),radial-gradient(circle at 70% 70%,rgba(255,255,255,.1) 0 7%,transparent 8%)}
.cell.tf{background:var(--forest)}
.cell.tf::after{content:"";position:absolute;inset:16% 22% 12%;background:#1d3b22;clip-path:polygon(50% 0,100% 70%,62% 70%,62% 100%,38% 100%,38% 70%,0 70%)}
.cell.tp{background:var(--swamp);background-image:repeating-linear-gradient(170deg,transparent 0 5px,rgba(255,255,255,.12) 5px 6px)}
.cell .cost{position:absolute;right:3px;bottom:1px;font-family:var(--f-code);font-size:calc(var(--c)*.26);color:rgba(255,255,255,.7);font-weight:600;z-index:1}
.start{position:absolute;inset:24%;border:2px dashed var(--ink-soft);border-radius:50%;opacity:.7}
.tower{position:absolute;inset:6%;z-index:1}
.kk{position:absolute;inset:18%;display:grid;place-items:center;z-index:2;transition:transform .3s,opacity .3s}
.kk svg{width:100%;height:100%;filter:drop-shadow(0 0 4px var(--k))}
.kk.got{transform:translateY(-70%) scale(.3);opacity:0}
.door{position:absolute;inset:4%;border:2px solid var(--k);background:repeating-linear-gradient(90deg,var(--k) 0 10%,transparent 10% 25%),rgba(0,0,0,.35);display:grid;place-items:center;transition:opacity .4s;border-radius:40% 40% 2px 2px}
.door b{background:var(--bg);color:var(--k);font-family:var(--f-label);font-size:calc(var(--c)*.34);padding:0 3px;border-radius:3px;line-height:1.1}
.door.open{opacity:.25}
.cell .hl{position:absolute;inset:6%;border:3px solid var(--mark);border-radius:4px;box-shadow:0 0 calc(var(--c)*.25) var(--mark);z-index:4;animation:pulse 1.2s infinite}
.cell .trail{position:absolute;inset:38%;border-radius:50%;background:var(--gold);opacity:.35;z-index:1}
@keyframes pulse{50%{opacity:.45}}
.robot{position:absolute;left:0;top:0;width:var(--c);height:var(--c);z-index:5;transition:transform var(--spd,180ms) ease-in-out}
.robot svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.robot .seta{transform-origin:50px 50px;transition:transform var(--spd,180ms) ease-in-out}
.robot.crash svg{animation:shake .35s}
@keyframes shake{0%,100%{translate:0}25%{translate:-8% 0}75%{translate:8% 0}}
.boom{position:absolute;width:var(--c);height:var(--c);border-radius:50%;background:radial-gradient(circle,#fff,var(--accent) 40%,transparent 70%);opacity:.85;z-index:6;animation:fade 1s forwards}
@keyframes fade{to{opacity:0}}
.perg{width:100%;max-width:100%;display:flex;flex-direction:column;gap:10px}
.perg .lbl{font-family:var(--f-label);font-weight:700;font-size:.8rem;letter-spacing:.12em;color:var(--gold)}
.perg pre{margin:0;font-family:var(--f-code);font-size:.74rem;line-height:1.6;color:var(--code-fg);background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;max-height:44vh}
.perg .saida{background:#1a1712;border-color:#4a3f2c}
.perg .saida span{display:block}
.perg .saida .ok{color:var(--ok)}
.perg .saida .bad{color:var(--err);background:rgba(243,154,143,.08)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(21,19,26,.86);z-index:10;padding:16px;overflow:auto}
.win{background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:18px 20px;text-align:center;max-width:340px;display:flex;flex-direction:column;gap:8px;align-items:center}
.win b{font-family:var(--f-display);font-size:2rem;font-weight:400;color:var(--gold)}
.stars{display:flex;gap:4px;font-size:2rem;line-height:1}
.stars span{color:var(--star-off)}
.stars span.on{color:var(--star)}
.win .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.note{font-size:.88rem;color:var(--ink-soft);overflow-wrap:anywhere}
.note:empty{display:none}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block;flex:none}

/* mapa de missões */
.levels{display:flex;flex-direction:column;gap:14px}
.world{padding:18px 20px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 18px}
.world .num{grid-row:1 / span 3;font-family:var(--f-display);color:var(--gold);font-size:3rem;line-height:.9;text-align:center;border-right:2px solid var(--line);padding-right:12px}
.world h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:1.9rem;letter-spacing:.01em}
.world p{margin:0 0 10px;color:var(--ink-soft);font-size:.96rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:10px 12px;color:var(--ink)}
.tile:hover:not(:disabled){border-color:var(--ink-soft)}
.tile .n{font-family:var(--f-label);font-size:.8rem;color:var(--ink-soft);letter-spacing:.1em}
.tile b{font-size:1.02rem;line-height:1.2}
.tile .s{font-size:1rem;letter-spacing:2px}
.tile .s span{color:var(--star-off)} .tile .s span.on{color:var(--star)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile.next{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.intro-card{padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.intro-card p{margin:0;max-width:68ch}
.intro-card .pre{font-size:.9rem;color:var(--ink-soft);margin-top:6px}
.loading{font-size:.8rem;color:var(--code-dim)}

@media (max-width:1020px){
  .game{grid-template-columns:minmax(0,1fr);grid-template-areas:"mission" "board" "editor"}
  .boardcard{position:static}
}
@media (max-width:600px){
  .mission{padding:16px}
  .top{gap:8px}
  .logo div{font-size:1.6rem;white-space:normal;line-height:1}
  .logo svg{width:34px;height:34px}
  .logo small{display:none}
  .pill{padding:5px 9px}
  .top .btn{padding:8px 12px}
  #code,.gutter{font-size:15px}
  .actions .btn{flex:1}
  .speed{margin-left:0;width:100%}
  .speed button{flex:1}
  .world{grid-template-columns:minmax(0,1fr)}
  .world .num{grid-row:auto;border-right:0;padding-right:0;font-size:2rem;text-align:left}
  .stage{min-height:260px}
  .win{padding:12px 14px;gap:6px}
  .win b{font-size:1.6rem}
  .stars{font-size:1.6rem}
}
@media (pointer:fine) and (min-width:1021px){.keys{display:none}}
@media (prefers-reduced-motion:reduce){.robot,.robot .seta,.kk{transition:none}.robot.crash svg,.cell .hl{animation:none}}
</style>
</head>
<body>


<header class="top">
  <div class="logo"><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M6 6 H36 V24 Q36 34 21 40 Q6 34 6 24 Z" fill="#292532" stroke="#e6b450" stroke-width="2"/><path d="M13 27 L21 12 L29 27 Z" fill="none" stroke="#c9473f" stroke-width="2.4" stroke-linejoin="round"/><rect x="17" y="27" width="8" height="5" fill="#e6b450"/><circle cx="21" cy="20" r="2.2" fill="#e6b450"/></svg><div>Forja Real<small>Java avançado</small></div></div>
  <div class="top-r">
    <span class="pill" title="Estrelas conquistadas"><span class="st">★</span><span id="starCount">0</span></span>
    <button class="btn" id="levelsBtn">Missões</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<template id="gameTpl">
  <div class="game">
    <section class="card mission" id="mission"></section>
    <section class="card boardcard" aria-label="Mapa do reino">
      <div class="bhead"><span id="bstatus"></span><div class="maps" id="maps"></div></div>
      <div class="stage" id="stage"><div class="board" id="board"></div></div>
      <div class="note" id="note"></div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="edcol">
      <div class="editor">
        <div class="ed-head"><span>Forja.java</span><span id="engine" class="loading">Java pronto</span></div>
        <div class="ed-body"><div class="gutter" id="gutter">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Editor de código Java"></textarea></div>
        <div class="keys" id="keys" aria-label="Símbolos"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="run">▶ Apresentar ao conselho</button>
        <button class="btn" id="stop" hidden>■ Parar</button>
        <button class="btn ghost" id="reset">Recomeçar código</button>
        <div class="speed" role="group" aria-label="Velocidade">
          <button data-speed="380">Lento</button><button data-speed="160">Normal</button><button data-speed="50">Rápido</button>
        </div>
      </div>
      <div id="feedback"></div>
    </section>
  </div>
</template>

<script>
/* MiniJava — interpretador de um subconjunto amplo de Java, para ensino no navegador.
   Suporta: classes, herança, interfaces, construtores, static, arrays, String, StringBuilder,
   Scanner (com entrada interativa por replay), Random, Math, ArrayList, HashMap/HashSet (ordem igual à do Java),
   exceções (try/catch/finally/throw), switch clássico e com seta, lambdas simples, printf/String.format
   e arquivos compactos do Java 25 (void main() solto). */
(function (root) {
"use strict";

/* =================================================================== erros */
class CompileError extends Error { constructor(msg, line){ super(msg); this.line = line; } }

<script>
const DADOS = {"distritos": [{"titulo": "Oficina das Runas", "ideia": "Genéricos, interfaces com métodos default e Comparator encadeado."}, {"titulo": "Salão dos Registros", "ideia": "Records, enums com comportamento e máquinas de estado."}, {"titulo": "Biblioteca de Pergaminhos", "ideia": "Streams, coletores e Optional."}, {"titulo": "Torre do Arquimago", "ideia": "Iterable, Builder e Observer: padrões com classes aninhadas e lambdas."}, {"titulo": "Masmorra", "ideia": "Interfaces seladas, pattern matching, exceções próprias e try-with-resources."}, {"titulo": "Cidadela", "ideia": "Algoritmos: Dijkstra com PriorityQueue, ordenação topológica e busca com estado."}], "missoes": [{"id": "r1", "distrito": 0, "titulo": "O baú genérico", "intro": "<p>O ferreiro real quer um único baú que sirva para qualquer coisa: moedas, joias, pergaminhos. Escrever um <code>BauDeMoedas<\/code>, um <code>BauDeJoias<\/code>... seria repetir o mesmo código. A saída é uma <b>classe genérica<\/b>: o tipo do conteúdo vira um parâmetro, <code>T<\/code>.<\/p>\n<pre>class Bau&lt;T&gt; {\n    private final List&lt;T&gt; itens = new ArrayList&lt;&gt;();\n    ...\n}\nBau&lt;String&gt; b = new Bau&lt;&gt;();   // aqui T é String<\/pre>\n<p>Métodos também podem ser genéricos, e o tipo pode ter um <b>limite<\/b>: <code>&lt;T extends Comparable&lt;T&gt;&gt;<\/code> só aceita tipos que sabem se comparar, então dá para chamar <code>compareTo<\/code>.<\/p>\n<pre>static &lt;T extends Comparable&lt;T&gt;&gt; T maior(List&lt;T&gt; l) { ... }\n&lt;R&gt; Bau&lt;R&gt; transformar(Function&lt;T, R&gt; f) { ... }   // f.apply(item) devolve um R<\/pre>", "task": "Crie <code>Bau&lt;T&gt;<\/code> com: <code>guardar(T item)<\/code>; <code>T retirar()<\/code>, que tira o <b>último<\/b> guardado; <code>T espiar()<\/code>, que devolve o último sem tirar (as duas lançam <code>IllegalStateException(\"baú vazio\")<\/code> se não houver nada); <code>int tamanho()<\/code>; <code>&lt;R&gt; Bau&lt;R&gt; transformar(Function&lt;T, R&gt; f)<\/code>, um baú novo com os itens convertidos na mesma ordem; e o método estático <code>&lt;T extends Comparable&lt;T&gt;&gt; T maisValioso(List&lt;T&gt; itens)<\/code>, que lança <code>IllegalArgumentException(\"lista vazia\")<\/code> se a lista estiver vazia.", "estacao": "record Joia(String nome, int valor) implements Comparable<Joia> {\n    public int compareTo(Joia o) { return Integer.compare(valor, o.valor); }\n}", "starter": "import java.util.*;\nimport java.util.function.*;\n\nclass Bau<T> {\n    private final List<T> itens = new ArrayList<>();\n\n    void guardar(T item) {\n        itens.add(item);\n    }\n\n    int tamanho() {\n        return itens.size();\n    }\n}\n", "solution": "import java.util.*;\nimport java.util.function.*;\n\nclass Bau<T> {\n    private final List<T> itens = new ArrayList<>();\n\n    void guardar(T item) {\n        itens.add(item);\n    }\n\n    T espiar() {\n        if (itens.isEmpty()) throw new IllegalStateException(\"baú vazio\");\n        return itens.get(itens.size() - 1);\n    }\n\n    T retirar() {\n        T item = espiar();\n        itens.remove(itens.size() - 1);\n        return item;\n    }\n\n    int tamanho() {\n        return itens.size();\n    }\n\n    <R> Bau<R> transformar(Function<T, R> f) {\n        Bau<R> novo = new Bau<>();\n        for (T item : itens) novo.guardar(f.apply(item));\n        return novo;\n    }\n\n    static <T extends Comparable<T>> T maisValioso(List<T> itens) {\n        if (itens.isEmpty()) throw new IllegalArgumentException(\"lista vazia\");\n        T melhor = itens.get(0);\n        for (T item : itens) if (item.compareTo(melhor) > 0) melhor = item;\n        return melhor;\n    }\n}\n", "hint": "Guarde tudo numa List<T>. espiar() olha itens.get(itens.size() - 1); retirar() pode reaproveitar espiar() e depois remover. Em transformar, crie um new Bau<>() e guarde f.apply(item) de cada item. Em maisValioso, percorra a lista guardando o maior até agora com compareTo(...) > 0.", "casos": [{"teste": "Bau<String> b = new Bau<>();\nb.guardar(\"pergaminho\");\nb.guardar(\"adaga\");\nb.guardar(\"elmo\");\nSystem.out.println(\"espiar: \" + b.espiar());\nSystem.out.println(\"retirar: \" + b.retirar());\nSystem.out.println(\"retirar: \" + b.retirar());\nSystem.out.println(\"tamanho: \" + b.tamanho());", "esperado": "espiar: elmo\nretirar: elmo\nretirar: adaga\ntamanho: 1\n"}, {"teste": "Bau<Integer> moedas = new Bau<>();\ntry {\n    moedas.retirar();\n} catch (IllegalStateException e) {\n    System.out.println(\"erro: \" + e.getMessage());\n}\nmoedas.guardar(10);\nmoedas.guardar(25);\nBau<String> etiquetas = moedas.transformar(m -> m + \" moedas\");\nSystem.out.println(\"etiqueta: \" + etiquetas.retirar());\nSystem.out.println(\"etiqueta: \" + etiquetas.espiar());\nSystem.out.println(\"original intacto: \" + moedas.tamanho());", "esperado": "erro: baú vazio\netiqueta: 25 moedas\netiqueta: 10 moedas\noriginal intacto: 2\n"}, {"teste": "System.out.println(\"maior número: \" + Bau.maisValioso(List.of(4, 17, 9)));\nSystem.out.println(\"maior palavra: \" + Bau.maisValioso(List.of(\"ouro\", \"prata\", \"ferro\")));\nSystem.out.println(\"joia mais valiosa: \" + Bau.maisValioso(List.of(new Joia(\"rubi\", 300), new Joia(\"safira\", 450), new Joia(\"topázio\", 120))));\ntry {\n    Bau.maisValioso(new ArrayList<Integer>());\n} catch (IllegalArgumentException e) {\n    System.out.println(\"erro: \" + e.getMessage());\n}", "esperado": "maior número: 17\nmaior palavra: prata\njoia mais valiosa: Joia[nome=safira, valor=450]\nerro: lista vazia\n"}]}, {"id": "r2", "distrito": 0, "titulo": "Encantamentos combinados", "intro": "<p>Cada encantamento do reino tem um <b>poder<\/b>. Os magos querem combiná-los à vontade: somar dois, multiplicar, criar encantamentos fixos na hora. Uma interface com <b>um único método abstrato<\/b> é uma <i>interface funcional<\/i>, e qualquer lambda serve como implementação:<\/p>\n<pre>interface Encantamento {\n    int poder();                                  // o único método abstrato\n    default int poderCom(int bonus) { ... }       // método com corpo, herdado de graça\n    static Encantamento fixo(int p) { return () -&gt; p; }   // fábrica\n}<\/pre>\n<p>Métodos <code>default<\/code> podem chamar <code>poder()<\/code> sem saber quem implementou, e podem <b>devolver lambdas novas<\/b>: <code>return () -&gt; poder() + outro.poder();<\/code> cria um encantamento que, quando consultado, soma os dois.<\/p>", "task": "Crie a interface <code>Encantamento<\/code> com <code>int poder()<\/code> e: <code>default int poderCom(int bonus)<\/code> (poder + bônus); <code>default Encantamento combinar(Encantamento outro)<\/code> (soma dos poderes); <code>default Encantamento vezes(int n)<\/code> (poder × n); <code>static Encantamento fixo(int p)<\/code>; e <code>static Encantamento somaDe(List&lt;Encantamento&gt; lista)<\/code>, cujo poder é a soma de todos (lista vazia: 0). Crie também a classe <code>Runa implements Encantamento<\/code>, com construtor <code>Runa(String nome, int forca)<\/code>, cujo poder é <code>forca * 10<\/code>.", "estacao": "", "starter": "import java.util.*;\n\ninterface Encantamento {\n    int poder();\n\n    static Encantamento fixo(int p) {\n        return () -> p;\n    }\n}\n", "solution": "import java.util.*;\n\ninterface Encantamento {\n    int poder();\n\n    default int poderCom(int bonus) {\n        return poder() + bonus;\n    }\n\n    default Encantamento combinar(Encantamento outro) {\n        return () -> poder() + outro.poder();\n    }\n\n    default Encantamento vezes(int n) {\n        return () -> poder() * n;\n    }\n\n    static Encantamento fixo(int p) {\n        return () -> p;\n    }\n\n    static Encantamento somaDe(List<Encantamento> lista) {\n        return () -> {\n            int total = 0;\n            for (Encantamento e : lista) total += e.poder();\n            return total;\n        };\n    }\n}\n\nclass Runa implements Encantamento {\n    private final String nome;\n    private final int forca;\n\n    Runa(String nome, int forca) {\n        this.nome = nome;\n        this.forca = forca;\n    }\n\n    public int poder() {\n        return forca * 10;\n    }\n}\n", "hint": "Cada default devolve uma lambda que calcula na hora: combinar → () -> poder() + outro.poder(); vezes → () -> poder() * n. somaDe pode devolver uma lambda com bloco que soma e.poder() de cada item. Runa é uma classe normal que implementa poder().", "casos": [{"teste": "Encantamento fogo = Encantamento.fixo(7);\nSystem.out.println(\"fogo: \" + fogo.poder());\nSystem.out.println(\"fogo com bônus 3: \" + fogo.poderCom(3));\nEncantamento duplo = fogo.combinar(Encantamento.fixo(5));\nSystem.out.println(\"fogo + 5: \" + duplo.poder());\nSystem.out.println(\"(fogo + 5) x 3: \" + duplo.vezes(3).poder());", "esperado": "fogo: 7\nfogo com bônus 3: 10\nfogo + 5: 12\n(fogo + 5) x 3: 36\n"}, {"teste": "Encantamento runa = new Runa(\"Thurisaz\", 4);\nSystem.out.println(\"runa: \" + runa.poder());\nSystem.out.println(\"runa com bônus: \" + runa.poderCom(2));\nEncantamento combo = runa.combinar(() -> 1).vezes(2);\nSystem.out.println(\"combo: \" + combo.poder());\nList<Encantamento> todos = new ArrayList<>(List.of(runa, Encantamento.fixo(3), new Runa(\"Ansuz\", 1)));\nEncantamento soma = Encantamento.somaDe(todos);\nSystem.out.println(\"soma: \" + soma.poder());\ntodos.add(Encantamento.fixo(100));\nSystem.out.println(\"soma depois de acrescentar: \" + soma.poder());\nSystem.out.println(\"soma vazia: \" + Encantamento.somaDe(List.of()).poder());", "esperado": "runa: 40\nruna com bônus: 42\ncombo: 82\nsoma: 53\nsoma depois de acrescentar: 153\nsoma vazia: 0\n"}]}, {"id": "r3", "distrito": 0, "titulo": "Ordem de batalha", "intro": "<p>No torneio do rei, os cavaleiros entram na arena por ordem: <b>mais forte primeiro<\/b>; empate na força, o <b>mais novo<\/b> primeiro; ainda empatados, pelo <b>nome<\/b> em ordem alfabética. Em vez de escrever um <code>compareTo<\/code> cheio de <code>if<\/code>, o Java permite <b>montar comparadores<\/b> como peças:<\/p>\n<pre>Comparator.comparing(Cavaleiro::nome)              // por nome, crescente\nComparator.comparingInt(Cavaleiro::forca).reversed() // por força, decrescente\nc1.thenComparing(c2)                               // c1; se empatar, c2\nc1.thenComparingInt(Cavaleiro::idade)              // c1; se empatar, idade<\/pre>\n<p>Cuidado: <code>reversed()<\/code> inverte <b>tudo<\/b> o que veio antes dele na cadeia. O record <code>Cavaleiro<\/code> já vem da estação.<\/p>", "task": "Crie a classe <code>Torneio<\/code> com: <code>static Comparator&lt;Cavaleiro&gt; ordemDeBatalha()<\/code> (força decrescente, depois idade crescente, depois nome); <code>static List&lt;Cavaleiro&gt; top(List&lt;Cavaleiro&gt; todos, int n)<\/code>, os <code>n<\/code> primeiros nessa ordem, <b>sem alterar<\/b> a lista recebida (se houver menos, devolve todos); e <code>static Comparator&lt;Cavaleiro&gt; porCasa(Comparator&lt;Cavaleiro&gt; dentroDaCasa)<\/code>, que agrupa por casa em ordem alfabética e, dentro da mesma casa, usa o comparador recebido.", "estacao": "record Cavaleiro(String nome, String casa, int forca, int idade) {}", "starter": "import java.util.*;\n\nclass Torneio {\n    static Comparator<Cavaleiro> ordemDeBatalha() {\n        return Comparator.comparing(Cavaleiro::nome);\n    }\n}\n", "solution": "import java.util.*;\n\nclass Torneio {\n    static Comparator<Cavaleiro> ordemDeBatalha() {\n        return Comparator.comparingInt(Cavaleiro::forca).reversed()\n                .thenComparingInt(Cavaleiro::idade)\n                .thenComparing(Cavaleiro::nome);\n    }\n\n    static List<Cavaleiro> top(List<Cavaleiro> todos, int n) {\n        List<Cavaleiro> copia = new ArrayList<>(todos);\n        copia.sort(ordemDeBatalha());\n        return copia.subList(0, Math.min(n, copia.size()));\n    }\n\n    static Comparator<Cavaleiro> porCasa(Comparator<Cavaleiro> dentroDaCasa) {\n        return Comparator.comparing(Cavaleiro::casa).thenComparing(dentroDaCasa);\n    }\n}\n", "hint": "Comece pela força: Comparator.comparingInt(Cavaleiro::forca).reversed() e só depois encadeie .thenComparingInt(Cavaleiro::idade).thenComparing(Cavaleiro::nome). Em top, copie a lista (new ArrayList<>(todos)), ordene a cópia e devolva subList(0, Math.min(n, tamanho)). porCasa é comparing(Cavaleiro::casa).thenComparing(dentroDaCasa).", "casos": [{"teste": "List<Cavaleiro> arena = new ArrayList<>(List.of(\n    new Cavaleiro(\"Edric\", \"Lobo\", 80, 30), new Cavaleiro(\"Alda\", \"Corvo\", 95, 41),\n    new Cavaleiro(\"Bran\", \"Lobo\", 80, 25), new Cavaleiro(\"Cora\", \"Leão\", 80, 25),\n    new Cavaleiro(\"Duna\", \"Corvo\", 60, 19)));\narena.sort(Torneio.ordemDeBatalha());\nfor (Cavaleiro c : arena) System.out.println(c.nome() + \" (força \" + c.forca() + \", \" + c.idade() + \" anos)\");", "esperado": "Alda (força 95, 41 anos)\nBran (força 80, 25 anos)\nCora (força 80, 25 anos)\nEdric (força 80, 30 anos)\nDuna (força 60, 19 anos)\n"}, {"teste": "List<Cavaleiro> inscritos = List.of(\n    new Cavaleiro(\"Ivo\", \"Leão\", 70, 33), new Cavaleiro(\"Gil\", \"Lobo\", 90, 50),\n    new Cavaleiro(\"Hela\", \"Corvo\", 90, 28), new Cavaleiro(\"Fen\", \"Leão\", 55, 22));\nSystem.out.println(\"top 2: \" + Torneio.top(inscritos, 2).stream().map(Cavaleiro::nome).toList());\nSystem.out.println(\"top 10: \" + Torneio.top(inscritos, 10).stream().map(Cavaleiro::nome).toList());\nSystem.out.println(\"lista original: \" + inscritos.stream().map(Cavaleiro::nome).toList());", "esperado": "top 2: [Hela, Gil]\ntop 10: [Hela, Gil, Ivo, Fen]\nlista original: [Ivo, Gil, Hela, Fen]\n"}, {"teste": "List<Cavaleiro> salao = new ArrayList<>(List.of(\n    new Cavaleiro(\"Ulf\", \"Lobo\", 40, 60), new Cavaleiro(\"Tia\", \"Corvo\", 85, 30),\n    new Cavaleiro(\"Sol\", \"Lobo\", 75, 22), new Cavaleiro(\"Rui\", \"Corvo\", 85, 27),\n    new Cavaleiro(\"Quel\", \"Leão\", 50, 31)));\nsalao.sort(Torneio.porCasa(Torneio.ordemDeBatalha()));\nfor (Cavaleiro c : salao) System.out.println(c.casa() + \": \" + c.nome());\nsalao.sort(Torneio.porCasa(Comparator.comparing(Cavaleiro::nome).reversed()));\nSystem.out.println(salao.stream().map(Cavaleiro::nome).toList());", "esperado": "Corvo: Rui\nCorvo: Tia\nLeão: Quel\nLobo: Sol\nLobo: Ulf\n[Tia, Rui, Quel, Ulf, Sol]\n"}]}, {"id": "r4", "distrito": 1, "titulo": "Coordenadas do reino", "intro": "<p>Os mapas do reino usam posições <code>(linha, coluna)<\/code> o tempo todo, e uma classe com construtor, getters, <code>equals<\/code>, <code>hashCode<\/code> e <code>toString<\/code> só para guardar dois números é muito código repetido. Um <b>record<\/b> gera tudo isso a partir dos componentes:<\/p>\n<pre>record Coord(int l, int c) { }\nnew Coord(2, 3).l()          // 2 (acessor gerado)\nnew Coord(2, 3)              // toString: Coord[l=2, c=3]\nnew Coord(2, 3).equals(new Coord(2, 3))   // true: compara os valores<\/pre>\n<p>Records são imutáveis. Para validar, use o <b>construtor compacto<\/b>, sem parâmetros e sem atribuições (elas acontecem sozinhas no fim):<\/p>\n<pre>record Coord(int l, int c) {\n    Coord {\n        if (...) throw new IllegalArgumentException(...);\n    }\n}<\/pre>", "task": "Crie <code>record Coord(int l, int c)<\/code> que recusa negativos com <code>IllegalArgumentException(\"coordenada negativa: (l, c)\")<\/code> (com os números), e os métodos: <code>Coord mais(int dl, int dc)<\/code>; <code>int distancia(Coord outra)<\/code> (Manhattan: |Δl| + |Δc|); <code>List&lt;Coord&gt; vizinhas()<\/code>, na ordem norte, leste, sul, oeste, <b>pulando<\/b> as que seriam negativas; e <code>static Coord de(String texto)<\/code>, que lê <code>\"3,4\"<\/code> (pode ter espaços em volta dos números).", "estacao": "", "starter": "import java.util.*;\n\nrecord Coord(int l, int c) {\n}\n", "solution": "import java.util.*;\n\nrecord Coord(int l, int c) {\n    Coord {\n        if (l < 0 || c < 0) throw new IllegalArgumentException(\"coordenada negativa: (\" + l + \", \" + c + \")\");\n    }\n\n    Coord mais(int dl, int dc) {\n        return new Coord(l + dl, c + dc);\n    }\n\n    int distancia(Coord outra) {\n        return Math.abs(l - outra.l) + Math.abs(c - outra.c);\n    }\n\n    List<Coord> vizinhas() {\n        List<Coord> lista = new ArrayList<>();\n        int[][] passos = {{-1, 0}, {0, 1}, {1, 0}, {0, -1}};\n        for (int[] p : passos) {\n            if (l + p[0] >= 0 && c + p[1] >= 0) lista.add(mais(p[0], p[1]));\n        }\n        return lista;\n    }\n\n    static Coord de(String texto) {\n        String[] partes = texto.split(\",\");\n        return new Coord(Integer.parseInt(partes[0].trim()), Integer.parseInt(partes[1].trim()));\n    }\n}\n", "hint": "O construtor compacto é Coord { if (l < 0 || c < 0) throw ...; } sem parênteses. Em vizinhas, percorra os quatro deslocamentos e só acrescente quando l + dl e c + dc não forem negativos (senão o próprio construtor lançaria exceção). Em de, use split(\",\") e trim() antes de Integer.parseInt.", "casos": [{"teste": "Coord a = new Coord(2, 3);\nSystem.out.println(a);\nSystem.out.println(\"mais(1, -2): \" + a.mais(1, -2));\nSystem.out.println(\"distância até (5, 1): \" + a.distancia(new Coord(5, 1)));\nSystem.out.println(\"iguais: \" + a.equals(new Coord(2, 3)) + \", mesmo hash: \" + (a.hashCode() == new Coord(2, 3).hashCode()));\nSet<Coord> visitadas = new HashSet<>(List.of(a, new Coord(2, 3), new Coord(3, 2)));\nSystem.out.println(\"posições diferentes: \" + visitadas.size());", "esperado": "Coord[l=2, c=3]\nmais(1, -2): Coord[l=3, c=1]\ndistância até (5, 1): 5\niguais: true, mesmo hash: true\nposições diferentes: 2\n"}, {"teste": "System.out.println(\"vizinhas de (2, 2): \" + new Coord(2, 2).vizinhas());\nSystem.out.println(\"vizinhas de (0, 0): \" + new Coord(0, 0).vizinhas());\nSystem.out.println(\"vizinhas de (0, 5): \" + new Coord(0, 5).vizinhas());", "esperado": "vizinhas de (2, 2): [Coord[l=1, c=2], Coord[l=2, c=3], Coord[l=3, c=2], Coord[l=2, c=1]]\nvizinhas de (0, 0): [Coord[l=0, c=1], Coord[l=1, c=0]]\nvizinhas de (0, 5): [Coord[l=0, c=6], Coord[l=1, c=5], Coord[l=0, c=4]]\n"}, {"teste": "System.out.println(Coord.de(\"3,4\"));\nSystem.out.println(Coord.de(\" 10 , 0 \"));\nfor (String txt : List.of(\"1,-1\", \"-2,7\")) {\n    try {\n        Coord.de(txt);\n    } catch (IllegalArgumentException e) {\n        System.out.println(\"recusada: \" + e.getMessage());\n    }\n}", "esperado": "Coord[l=3, c=4]\nCoord[l=10, c=0]\nrecusada: coordenada negativa: (1, -1)\nrecusada: coordenada negativa: (-2, 7)\n"}]}, {"id": "r5", "distrito": 1, "titulo": "Rosa dos ventos", "intro": "<p>Os golens do reino andam por comandos simples: <code>F<\/code> (um passo à frente), <code>D<\/code> (virar à direita) e <code>E<\/code> (virar à esquerda). Para isso eles precisam de um tipo para as quatro direções, e um <b>enum<\/b> é perfeito: um conjunto fixo de constantes que podem ter <b>atributos, construtor e métodos<\/b>.<\/p>\n<pre>enum Direcao {\n    NORTE('N', -1, 0), LESTE('L', 0, 1), ...;    // cada constante chama o construtor\n    final char letra; final int dl, dc;\n    Direcao(char letra, int dl, int dc) { ... }\n}\nDirecao.values()      // [NORTE, LESTE, SUL, OESTE], na ordem declarada\nd.ordinal()           // posição: NORTE é 0, LESTE é 1...<\/pre>\n<p>Com as constantes em ordem horária, <code>values()[(ordinal() + 1) % 4]<\/code> é a próxima direção. O record <code>Coord<\/code> e o mapa já vêm da estação.<\/p>", "task": "Crie <code>enum Direcao<\/code> com <code>NORTE('N', -1, 0)<\/code>, <code>LESTE('L', 0, 1)<\/code>, <code>SUL('S', 1, 0)<\/code>, <code>OESTE('O', 0, -1)<\/code> nessa ordem, os atributos <code>letra<\/code>, <code>dl<\/code> e <code>dc<\/code>, e os métodos <code>horario()<\/code>, <code>antiHorario()<\/code>, <code>oposta()<\/code>, <code>Coord aplicar(Coord c)<\/code> (um passo nessa direção) e <code>static Direcao de(char letra)<\/code>, que lança <code>IllegalArgumentException(\"direção inválida: X\")<\/code> para letras desconhecidas. O golem vai patrulhar usando o seu enum.", "estacao": "record Coord(int l, int c) {\n    Coord mais(int dl, int dc) { return new Coord(l + dl, c + dc); }\n    int distancia(Coord o) { return Math.abs(l - o.l) + Math.abs(c - o.c); }\n}\n\nclass Mapa {\n    private final String[] linhas;\n\n    Mapa(String... linhas) { this.linhas = linhas; }\n\n    int altura() { return linhas.length; }\n    int largura() { return linhas[0].length(); }\n\n    char em(Coord p) {\n        if (p.l() < 0 || p.c() < 0 || p.l() >= altura() || p.c() >= largura()) return '#';\n        return linhas[p.l()].charAt(p.c());\n    }\n\n    boolean livre(Coord p) { return em(p) != '#'; }\n\n    Coord achar(char ch) {\n        for (int l = 0; l < altura(); l++) {\n            int c = linhas[l].indexOf(ch);\n            if (c >= 0) return new Coord(l, c);\n        }\n        return null;\n    }\n}", "oculto": "class Cena {\n    static void inicio(Coord p) { System.out.println(\"@pos \" + p.l() + \" \" + p.c()); }\n    static void virar(Direcao d) { System.out.println(\"@turn \" + d.letra); }\n    static Coord andar(Mapa m, Coord p, Direcao d) {\n        Coord n = new Coord(p.l() + d.dl, p.c() + d.dc);\n        if (!m.livre(n)) {\n            System.out.println(\"@crash \" + n.l() + \" \" + n.c() + \" \" + d.letra);\n            throw new IllegalStateException(\"o golem bateu numa muralha em (\" + n.l() + \", \" + n.c() + \")\");\n        }\n        System.out.println(\"@move \" + n.l() + \" \" + n.c() + \" \" + d.letra);\n        return n;\n    }\n}\n\nclass Patrulha {\n    static void executar(Mapa m, String comandos) {\n        Coord p = m.achar('S');\n        Direcao d = Direcao.LESTE;\n        Cena.inicio(p);\n        for (char cmd : comandos.toCharArray()) {\n            switch (cmd) {\n                case 'F' -> p = Cena.andar(m, p, d);\n                case 'D' -> { d = d.horario(); Cena.virar(d); }\n                case 'E' -> { d = d.antiHorario(); Cena.virar(d); }\n            }\n        }\n        System.out.println(\"golem terminou em (\" + p.l() + \", \" + p.c() + \") olhando para \" + d);\n        System.out.println(m.em(p) == '@' ? \"chegou à torre\" : \"não chegou à torre\");\n    }\n}", "starter": "enum Direcao {\n    NORTE('N', -1, 0), LESTE('L', 0, 1), SUL('S', 1, 0), OESTE('O', 0, -1);\n\n    final char letra;\n    final int dl, dc;\n\n    Direcao(char letra, int dl, int dc) {\n        this.letra = letra;\n        this.dl = dl;\n        this.dc = dc;\n    }\n}\n", "solution": "enum Direcao {\n    NORTE('N', -1, 0), LESTE('L', 0, 1), SUL('S', 1, 0), OESTE('O', 0, -1);\n\n    final char letra;\n    final int dl, dc;\n\n    Direcao(char letra, int dl, int dc) {\n        this.letra = letra;\n        this.dl = dl;\n        this.dc = dc;\n    }\n\n    Direcao horario() {\n        return values()[(ordinal() + 1) % 4];\n    }\n\n    Direcao antiHorario() {\n        return values()[(ordinal() + 3) % 4];\n    }\n\n    Direcao oposta() {\n        return values()[(ordinal() + 2) % 4];\n    }\n\n    Coord aplicar(Coord c) {\n        return c.mais(dl, dc);\n    }\n\n    static Direcao de(char letra) {\n        for (Direcao d : values()) {\n            if (d.letra == letra) return d;\n        }\n        throw new IllegalArgumentException(\"direção inválida: \" + letra);\n    }\n}\n", "hint": "horario é values()[(ordinal() + 1) % 4]; antiHorario soma 3 (o mesmo que voltar 1); oposta soma 2. aplicar é c.mais(dl, dc). Em de, percorra values() comparando o atributo letra e, se nenhuma servir, lance a exceção.", "casos": [{"teste": "for (Direcao d : Direcao.values())\n    System.out.println(d + \": horário \" + d.horario() + \", anti-horário \" + d.antiHorario() + \", oposta \" + d.oposta());\nSystem.out.println(Direcao.de('S') + \" \" + Direcao.SUL.aplicar(new Coord(2, 2)) + \" \" + Direcao.valueOf(\"OESTE\").ordinal());\ntry {\n    Direcao.de('X');\n} catch (IllegalArgumentException e) {\n    System.out.println(e.getMessage());\n}", "esperado": "NORTE: horário LESTE, anti-horário OESTE, oposta SUL\nLESTE: horário SUL, anti-horário NORTE, oposta OESTE\nSUL: horário OESTE, anti-horário LESTE, oposta NORTE\nOESTE: horário NORTE, anti-horário SUL, oposta LESTE\nSUL Coord[l=3, c=2] 3\ndireção inválida: X\n"}, {"mapa": ["##########", "#S...#...#", "#.##.#.#.#", "#.#..#.#.#", "#.#.##.#.#", "#......#@#", "##########"], "teste": "Mapa m = new Mapa(\"##########\", \"#S...#...#\", \"#.##.#.#.#\", \"#.#..#.#.#\", \"#.#.##.#.#\", \"#......#@#\", \"##########\");\nPatrulha.executar(m, \"DFFFFEFFFFFEFFFFDFFDFFFF\");", "esperado": "@pos 1 1\n@turn S\n@move 2 1 S\n@move 3 1 S\n@move 4 1 S\n@move 5 1 S\n@turn L\n@move 5 2 L\n@move 5 3 L\n@move 5 4 L\n@move 5 5 L\n@move 5 6 L\n@turn N\n@move 4 6 N\n@move 3 6 N\n@move 2 6 N\n@move 1 6 N\n@turn L\n@move 1 7 L\n@move 1 8 L\n@turn S\n@move 2 8 S\n@move 3 8 S\n@move 4 8 S\n@move 5 8 S\ngolem terminou em (5, 8) olhando para SUL\nchegou à torre\n"}, {"mapa": ["#########", "#.......#", "#.#####.#", "#.#S..#.#", "#.###.#.#", "#.....#@#", "#########"], "teste": "Mapa m = new Mapa(\"#########\", \"#.......#\", \"#.#####.#\", \"#.#S..#.#\", \"#.###.#.#\", \"#.....#@#\", \"#########\");\nPatrulha.executar(m, \"FFDFFDFFFFDFFFFDFFFFFFDFFFF\");", "esperado": "@pos 3 3\n@move 3 4 L\n@move 3 5 L\n@turn S\n@move 4 5 S\n@move 5 5 S\n@turn O\n@move 5 4 O\n@move 5 3 O\n@move 5 2 O\n@move 5 1 O\n@turn N\n@move 4 1 N\n@move 3 1 N\n@move 2 1 N\n@move 1 1 N\n@turn L\n@move 1 2 L\n@move 1 3 L\n@move 1 4 L\n@move 1 5 L\n@move 1 6 L\n@move 1 7 L\n@turn S\n@move 2 7 S\n@move 3 7 S\n@move 4 7 S\n@move 5 7 S\ngolem terminou em (5, 7) olhando para SUL\nchegou à torre\n"}]}, {"id": "r6", "distrito": 1, "titulo": "O portão do castelo", "intro": "<p>O portão levadiço do castelo tem estados bem definidos: fechado, abrindo, aberto, fechando e trancado. Cada <b>evento<\/b> (ordem de abrir, fim do movimento, tranca...) leva de um estado a outro. Isso é uma <b>máquina de estados<\/b>, e dois enums a descrevem sem nenhuma variável solta:<\/p>\n<pre>FECHADO  + ABRIR      → ABRINDO        ABRINDO  + PRONTO     → ABERTO\nABERTO   + FECHAR     → FECHANDO       FECHANDO + PRONTO     → FECHADO\nFECHANDO + ABRIR      → ABRINDO        FECHADO  + TRANCAR    → TRANCADO\nTRANCADO + DESTRANCAR → FECHADO        qualquer outro caso   → continua igual<\/pre>\n<p>O <b>switch com seta<\/b> sobre um enum usa os nomes das constantes direto, e pode devolver um valor:<\/p>\n<pre>return switch (this) {\n    case FECHADO -&gt; ...;\n    default -&gt; this;\n};<\/pre>", "task": "Crie <code>enum Evento { ABRIR, FECHAR, PRONTO, TRANCAR, DESTRANCAR }<\/code> e <code>enum Estado { FECHADO, ABRINDO, ABERTO, FECHANDO, TRANCADO }<\/code>, com <code>Estado reagir(Evento e)<\/code> seguindo a tabela e <code>boolean passavel()<\/code> (só <code>ABERTO<\/code>). Crie também a classe <code>Portao<\/code>: começa <code>FECHADO<\/code>, tem <code>Estado estado()<\/code>, <code>void receber(Evento e)<\/code> e <code>List&lt;Estado&gt; historico()<\/code>, a lista de estados por onde passou (começando pelo inicial e acrescentando só quando o estado <b>muda<\/b>).", "estacao": "", "starter": "import java.util.*;\n\nenum Evento { ABRIR, FECHAR, PRONTO, TRANCAR, DESTRANCAR }\n\nenum Estado {\n    FECHADO, ABRINDO, ABERTO, FECHANDO, TRANCADO;\n\n    Estado reagir(Evento e) {\n        return this;\n    }\n}\n", "solution": "import java.util.*;\n\nenum Evento { ABRIR, FECHAR, PRONTO, TRANCAR, DESTRANCAR }\n\nenum Estado {\n    FECHADO, ABRINDO, ABERTO, FECHANDO, TRANCADO;\n\n    Estado reagir(Evento e) {\n        return switch (this) {\n            case FECHADO -> e == Evento.ABRIR ? ABRINDO : e == Evento.TRANCAR ? TRANCADO : this;\n            case ABRINDO -> e == Evento.PRONTO ? ABERTO : this;\n            case ABERTO -> e == Evento.FECHAR ? FECHANDO : this;\n            case FECHANDO -> e == Evento.PRONTO ? FECHADO : e == Evento.ABRIR ? ABRINDO : this;\n            case TRANCADO -> e == Evento.DESTRANCAR ? FECHADO : this;\n        };\n    }\n\n    boolean passavel() {\n        return this == ABERTO;\n    }\n}\n\nclass Portao {\n    private Estado estado = Estado.FECHADO;\n    private final List<Estado> historico = new ArrayList<>(List.of(Estado.FECHADO));\n\n    Estado estado() {\n        return estado;\n    }\n\n    void receber(Evento e) {\n        Estado novo = estado.reagir(e);\n        if (novo != estado) {\n            estado = novo;\n            historico.add(novo);\n        }\n    }\n\n    List<Estado> historico() {\n        return List.copyOf(historico);\n    }\n}\n", "hint": "Em reagir, faça switch (this) com um caso para cada estado e, dentro, compare o evento (e == Evento.ABRIR ? ... : ...). Sem transição na tabela, devolva this. No Portao, guarde o estado atual e uma lista; em receber, calcule o novo estado e só acrescente ao histórico se ele for diferente do atual.", "casos": [{"teste": "for (Estado s : Estado.values()) {\n    StringBuilder linha = new StringBuilder(s + \":\");\n    for (Evento e : Evento.values()) linha.append(\" \").append(e).append(\"→\").append(s.reagir(e));\n    System.out.println(linha);\n}\nSystem.out.println(\"passável: \" + Estado.ABERTO.passavel() + \" \" + Estado.ABRINDO.passavel());", "esperado": "FECHADO: ABRIR→ABRINDO FECHAR→FECHADO PRONTO→FECHADO TRANCAR→TRANCADO DESTRANCAR→FECHADO\nABRINDO: ABRIR→ABRINDO FECHAR→ABRINDO PRONTO→ABERTO TRANCAR→ABRINDO DESTRANCAR→ABRINDO\nABERTO: ABRIR→ABERTO FECHAR→FECHANDO PRONTO→ABERTO TRANCAR→ABERTO DESTRANCAR→ABERTO\nFECHANDO: ABRIR→ABRINDO FECHAR→FECHANDO PRONTO→FECHADO TRANCAR→FECHANDO DESTRANCAR→FECHANDO\nTRANCADO: ABRIR→TRANCADO FECHAR→TRANCADO PRONTO→TRANCADO TRANCAR→TRANCADO DESTRANCAR→FECHADO\npassável: true false\n"}, {"teste": "Portao p = new Portao();\nfor (Evento e : List.of(Evento.FECHAR, Evento.ABRIR, Evento.ABRIR, Evento.PRONTO, Evento.TRANCAR, Evento.FECHAR, Evento.ABRIR, Evento.PRONTO)) {\n    p.receber(e);\n    System.out.println(e + \" → \" + p.estado() + (p.estado().passavel() ? \" (dá para passar)\" : \"\"));\n}\nSystem.out.println(\"histórico: \" + p.historico());", "esperado": "FECHAR → FECHADO\nABRIR → ABRINDO\nABRIR → ABRINDO\nPRONTO → ABERTO (dá para passar)\nTRANCAR → ABERTO (dá para passar)\nFECHAR → FECHANDO\nABRIR → ABRINDO\nPRONTO → ABERTO (dá para passar)\nhistórico: [FECHADO, ABRINDO, ABERTO, FECHANDO, ABRINDO, ABERTO]\n"}, {"teste": "Portao p = new Portao();\nfor (String ordem : \"TRANCAR ABRIR DESTRANCAR ABRIR PRONTO FECHAR PRONTO\".split(\" \")) p.receber(Evento.valueOf(ordem));\nSystem.out.println(\"estado final: \" + p.estado());\nSystem.out.println(\"histórico: \" + p.historico());", "esperado": "estado final: FECHADO\nhistórico: [FECHADO, TRANCADO, FECHADO, ABRINDO, ABERTO, FECHANDO, FECHADO]\n"}]}, {"id": "r7", "distrito": 2, "titulo": "O censo do reino", "intro": "<p>O escriba real tem a lista de todos os aldeões e precisa responder perguntas o dia todo. Com <b>streams<\/b>, cada pergunta vira uma linha de transformações, sem laços nem variáveis acumuladoras:<\/p>\n<pre>povo.stream()\n    .filter(a -&gt; a.ouro() &gt;= 100)        // só os que passam no teste\n    .map(Aldeao::nome)                    // troca cada aldeão pelo nome\n    .sorted()                             // ordena\n    .toList();                            // junta numa lista<\/pre>\n<p>Para números há streams especiais: <code>mapToInt(Aldeao::ouro).sum()<\/code>. E quando a resposta pode não existir (o mais velho de uma lista vazia), o stream devolve um <b>Optional<\/b>: <code>max(...)<\/code> dá <code>Optional&lt;Aldeao&gt;<\/code>, e <code>average()<\/code> dá <code>OptionalDouble<\/code>, com <code>orElse(...)<\/code> para o valor padrão.<\/p>", "task": "Crie a classe <code>Censo<\/code> com: <code>static List&lt;String&gt; ricos(List&lt;Aldeao&gt; povo, int minimo)<\/code> (nomes com ouro ≥ mínimo, em ordem alfabética); <code>static int ouroTotal(List&lt;Aldeao&gt; povo)<\/code>; <code>static Optional&lt;Aldeao&gt; maisVelho(List&lt;Aldeao&gt; povo)<\/code> (no empate, o primeiro da lista); e <code>static double mediaIdade(List&lt;Aldeao&gt; povo, String vila)<\/code> (0.0 se a vila não tiver ninguém). Use streams.", "estacao": "record Aldeao(String nome, String vila, int idade, int ouro) {}", "forbid": [["\\bfor\\s*\\(|\\bwhile\\s*\\(", "Nesta missão, resolva com streams: sem for nem while."]], "starter": "import java.util.*;\n\nclass Censo {\n    static List<String> ricos(List<Aldeao> povo, int minimo) {\n        return povo.stream()\n                .map(Aldeao::nome)\n                .toList();\n    }\n}\n", "solution": "import java.util.*;\n\nclass Censo {\n    static List<String> ricos(List<Aldeao> povo, int minimo) {\n        return povo.stream()\n                .filter(a -> a.ouro() >= minimo)\n                .map(Aldeao::nome)\n                .sorted()\n                .toList();\n    }\n\n    static int ouroTotal(List<Aldeao> povo) {\n        return povo.stream().mapToInt(Aldeao::ouro).sum();\n    }\n\n    static Optional<Aldeao> maisVelho(List<Aldeao> povo) {\n        return povo.stream().max(Comparator.comparingInt(Aldeao::idade));\n    }\n\n    static double mediaIdade(List<Aldeao> povo, String vila) {\n        return povo.stream()\n                .filter(a -> a.vila().equals(vila))\n                .mapToInt(Aldeao::idade)\n                .average()\n                .orElse(0.0);\n    }\n}\n", "hint": "ricos: filter (ouro >= minimo) → map(Aldeao::nome) → sorted() → toList(). ouroTotal: mapToInt(Aldeao::ouro).sum(). maisVelho: max(Comparator.comparingInt(Aldeao::idade)) já devolve Optional e, no empate, fica com o primeiro. mediaIdade: filter pela vila, mapToInt(idade), average() e orElse(0.0).", "casos": [{"teste": "List<Aldeao> povo = List.of(\n    new Aldeao(\"Ana\", \"Vale Verde\", 34, 120), new Aldeao(\"Bento\", \"Pedra Alta\", 52, 40),\n    new Aldeao(\"Clara\", \"Vale Verde\", 17, 15), new Aldeao(\"Dario\", \"Porto Sul\", 61, 300),\n    new Aldeao(\"Eva\", \"Pedra Alta\", 28, 90), new Aldeao(\"Fábio\", \"Vale Verde\", 61, 75),\n    new Aldeao(\"Gina\", \"Porto Sul\", 15, 5), new Aldeao(\"Heitor\", \"Porto Sul\", 40, 210));\nSystem.out.println(\"ricos (100+): \" + Censo.ricos(povo, 100));\nSystem.out.println(\"ricos (1000+): \" + Censo.ricos(povo, 1000));\nSystem.out.println(\"ricos do porto: \" + Censo.ricos(List.of(new Aldeao(\"Zoe\", \"Porto Sul\", 30, 500), new Aldeao(\"Bia\", \"Porto Sul\", 22, 600), new Aldeao(\"Léo\", \"Porto Sul\", 45, 80)), 100));\nSystem.out.println(\"ouro total: \" + Censo.ouroTotal(povo));", "esperado": "ricos (100+): [Ana, Dario, Heitor]\nricos (1000+): []\nricos do porto: [Bia, Zoe]\nouro total: 855\n"}, {"teste": "List<Aldeao> povo = List.of(\n    new Aldeao(\"Ana\", \"Vale Verde\", 34, 120), new Aldeao(\"Bento\", \"Pedra Alta\", 52, 40),\n    new Aldeao(\"Clara\", \"Vale Verde\", 17, 15), new Aldeao(\"Dario\", \"Porto Sul\", 61, 300),\n    new Aldeao(\"Eva\", \"Pedra Alta\", 28, 90), new Aldeao(\"Fábio\", \"Vale Verde\", 61, 75),\n    new Aldeao(\"Gina\", \"Porto Sul\", 15, 5), new Aldeao(\"Heitor\", \"Porto Sul\", 40, 210));\nSystem.out.println(\"mais velho: \" + Censo.maisVelho(povo).map(Aldeao::nome).orElse(\"ninguém\"));\nSystem.out.println(\"mais velho de ninguém: \" + Censo.maisVelho(List.of()));\nSystem.out.println(\"média Porto Sul: \" + Censo.mediaIdade(povo, \"Porto Sul\"));\nSystem.out.println(\"média Vale Verde: \" + Censo.mediaIdade(povo, \"Vale Verde\"));\nSystem.out.println(\"média Lugar Nenhum: \" + Censo.mediaIdade(povo, \"Lugar Nenhum\"));", "esperado": "mais velho: Dario\nmais velho de ninguém: Optional.empty\nmédia Porto Sul: 38.666666666666664\nmédia Vale Verde: 37.333333333333336\nmédia Lugar Nenhum: 0.0\n"}]}, {"id": "r8", "distrito": 2, "titulo": "Relatório do escriba", "intro": "<p>O rei quer relatórios agrupados: quantos aldeões em cada vila, quanto ouro cada vila tem, quem é adulto. O terminal <code>collect<\/code> recebe um <b>coletor<\/b> que diz como juntar o resultado:<\/p>\n<pre>Collectors.groupingBy(Aldeao::vila, TreeMap::new, Collectors.counting())\n//          ↑ chave              ↑ tipo do mapa   ↑ o que fazer com cada grupo\nCollectors.summingInt(Aldeao::ouro)\nCollectors.partitioningBy(a -&gt; a.idade() &gt;= 18, Collectors.mapping(Aldeao::nome, Collectors.toList()))\nCollectors.joining(\", \", \"Presentes: \", \".\")<\/pre>\n<p>Use <code>TreeMap::new<\/code> para que as vilas saiam em ordem alfabética. Os coletores se encaixam uns nos outros: <code>mapping<\/code> transforma cada item antes de entregar ao coletor de dentro.<\/p>", "task": "Crie a classe <code>Relatorio<\/code> com: <code>static Map&lt;String, Long&gt; porVila(List&lt;Aldeao&gt; povo)<\/code> (contagem, vilas em ordem alfabética); <code>static Map&lt;String, Integer&gt; ouroPorVila(...)<\/code> (soma, em ordem alfabética); <code>static Map&lt;Boolean, List&lt;String&gt;&gt; adultos(...)<\/code> (nomes particionados por idade ≥ 18, na ordem da lista); e <code>static String chamada(...)<\/code>: os nomes do mais velho para o mais novo (empate: ordem alfabética), separados por <code>\", \"<\/code>, com <code>\"Presentes: \"<\/code> no começo e <code>\".\"<\/code> no fim.", "estacao": "record Aldeao(String nome, String vila, int idade, int ouro) {}", "forbid": [["\\bfor\\s*\\(|\\bwhile\\s*\\(", "Nesta missão, resolva com streams e coletores: sem for nem while."]], "starter": "import java.util.*;\nimport java.util.stream.*;\n\nclass Relatorio {\n    static Map<String, Long> porVila(List<Aldeao> povo) {\n        return povo.stream().collect(Collectors.groupingBy(Aldeao::vila, Collectors.counting()));\n    }\n}\n", "solution": "import java.util.*;\nimport java.util.stream.*;\n\nclass Relatorio {\n    static Map<String, Long> porVila(List<Aldeao> povo) {\n        return povo.stream().collect(Collectors.groupingBy(Aldeao::vila, TreeMap::new, Collectors.counting()));\n    }\n\n    static Map<String, Integer> ouroPorVila(List<Aldeao> povo) {\n        return povo.stream().collect(Collectors.groupingBy(Aldeao::vila, TreeMap::new, Collectors.summingInt(Aldeao::ouro)));\n    }\n\n    static Map<Boolean, List<String>> adultos(List<Aldeao> povo) {\n        return povo.stream().collect(Collectors.partitioningBy(a -> a.idade() >= 18,\n                Collectors.mapping(Aldeao::nome, Collectors.toList())));\n    }\n\n    static String chamada(List<Aldeao> povo) {\n        return povo.stream()\n                .sorted(Comparator.comparingInt(Aldeao::idade).reversed().thenComparing(Aldeao::nome))\n                .map(Aldeao::nome)\n                .collect(Collectors.joining(\", \", \"Presentes: \", \".\"));\n    }\n}\n", "hint": "groupingBy tem uma versão com três argumentos: a chave, TreeMap::new e o coletor de cada grupo (counting() ou summingInt(Aldeao::ouro)). Para adultos, partitioningBy(teste, mapping(Aldeao::nome, toList())). Em chamada, ordene com comparingInt(idade).reversed().thenComparing(nome), mapeie para o nome e use joining(\", \", \"Presentes: \", \".\").", "casos": [{"teste": "List<Aldeao> povo = List.of(\n    new Aldeao(\"Ana\", \"Vale Verde\", 34, 120), new Aldeao(\"Bento\", \"Pedra Alta\", 52, 40),\n    new Aldeao(\"Clara\", \"Vale Verde\", 17, 15), new Aldeao(\"Dario\", \"Porto Sul\", 61, 300),\n    new Aldeao(\"Eva\", \"Pedra Alta\", 28, 90), new Aldeao(\"Fábio\", \"Vale Verde\", 61, 75),\n    new Aldeao(\"Gina\", \"Porto Sul\", 15, 5), new Aldeao(\"Heitor\", \"Porto Sul\", 40, 210));\nSystem.out.println(\"por vila: \" + Relatorio.porVila(povo));\nSystem.out.println(\"ouro por vila: \" + Relatorio.ouroPorVila(povo));", "esperado": "por vila: {Pedra Alta=2, Porto Sul=3, Vale Verde=3}\nouro por vila: {Pedra Alta=130, Porto Sul=515, Vale Verde=210}\n"}, {"teste": "List<Aldeao> povo = List.of(\n    new Aldeao(\"Ana\", \"Vale Verde\", 34, 120), new Aldeao(\"Bento\", \"Pedra Alta\", 52, 40),\n    new Aldeao(\"Clara\", \"Vale Verde\", 17, 15), new Aldeao(\"Dario\", \"Porto Sul\", 61, 300),\n    new Aldeao(\"Eva\", \"Pedra Alta\", 28, 90), new Aldeao(\"Fábio\", \"Vale Verde\", 61, 75),\n    new Aldeao(\"Gina\", \"Porto Sul\", 15, 5), new Aldeao(\"Heitor\", \"Porto Sul\", 40, 210));\nMap<Boolean, List<String>> grupos = Relatorio.adultos(povo);\nSystem.out.println(\"adultos: \" + grupos.get(true));\nSystem.out.println(\"jovens: \" + grupos.get(false));\nSystem.out.println(Relatorio.chamada(povo));\nSystem.out.println(Relatorio.chamada(List.of()));", "esperado": "adultos: [Ana, Bento, Dario, Eva, Fábio, Heitor]\njovens: [Clara, Gina]\nPresentes: Dario, Fábio, Bento, Heitor, Ana, Eva, Clara, Gina.\nPresentes: .\n"}]}, {"id": "r9", "distrito": 2, "titulo": "Rotas das caravanas", "intro": "<p>As caravanas cruzam o reino levando listas de mercadorias. Uma lista de listas pede <code>flatMap<\/code>, que transforma cada item num stream e <b>achata<\/b> tudo num stream só:<\/p>\n<pre>caravanas.stream()\n    .flatMap(cv -&gt; cv.carga().stream())   // Stream&lt;String&gt; com todas as cargas\n    .distinct().sorted().toList();<\/pre>\n<p>Buscas que podem falhar devolvem <code>Optional<\/code>, e dá para encadear transformações sem nenhum <code>if (x != null)<\/code>:<\/p>\n<pre>buscar(...)                     // Optional&lt;String&gt;\n    .map(String::toUpperCase)   // só roda se houver valor\n    .orElse(\"NINGUÉM\");         // valor quando estiver vazio<\/pre>\n<p>Para montar mapas com regra de desempate: <code>Collectors.toMap(chave, valor, (a, b) -&gt; ..., TreeMap::new)<\/code>; o terceiro argumento decide o que fazer quando a mesma chave aparece de novo.<\/p>", "task": "Crie a classe <code>Comercio<\/code> com: <code>static List&lt;String&gt; mercadorias(List&lt;Caravana&gt; cs)<\/code> (todas, sem repetir, em ordem alfabética); <code>static Optional&lt;String&gt; quemLeva(List&lt;Caravana&gt; cs, String item)<\/code> (o líder da <b>primeira<\/b> caravana com aquele item); <code>static String anuncio(List&lt;Caravana&gt; cs, String item)<\/code>, que devolve <code>\"ITEM: LÍDER\"<\/code> em maiúsculas ou <code>\"ITEM: NINGUÉM\"<\/code>; e <code>static Map&lt;String, Integer&gt; prazoPorItem(List&lt;Caravana&gt; cs)<\/code>: para cada mercadoria, o <b>menor<\/b> número de dias entre as caravanas que a levam, em ordem alfabética.", "estacao": "record Caravana(String lider, List<String> carga, int dias) {}", "forbid": [["\\bfor\\s*\\(|\\bwhile\\s*\\(", "Nesta missão, resolva com streams e Optional: sem for nem while."]], "starter": "import java.util.*;\nimport java.util.stream.*;\n\nclass Comercio {\n    static List<String> mercadorias(List<Caravana> cs) {\n        return List.of();\n    }\n}\n", "solution": "import java.util.*;\nimport java.util.stream.*;\n\nclass Comercio {\n    static List<String> mercadorias(List<Caravana> cs) {\n        return cs.stream().flatMap(c -> c.carga().stream()).distinct().sorted().toList();\n    }\n\n    static Optional<String> quemLeva(List<Caravana> cs, String item) {\n        return cs.stream().filter(c -> c.carga().contains(item)).map(Caravana::lider).findFirst();\n    }\n\n    static String anuncio(List<Caravana> cs, String item) {\n        return (item + \": \" + quemLeva(cs, item).orElse(\"ninguém\")).toUpperCase();\n    }\n\n    static Map<String, Integer> prazoPorItem(List<Caravana> cs) {\n        return cs.stream()\n                .flatMap(c -> c.carga().stream().map(item -> Map.entry(item, c.dias())))\n                .collect(Collectors.toMap(Map.Entry::getKey, Map.Entry::getValue, Math::min, TreeMap::new));\n    }\n}\n", "hint": "mercadorias: flatMap(c -> c.carga().stream()), depois distinct(), sorted(), toList(). quemLeva: filter pelo contains, map(Caravana::lider), findFirst(). Para prazoPorItem, transforme cada carga em pares (item, dias) com Map.entry(item, c.dias()) dentro do flatMap e junte com toMap(Map.Entry::getKey, Map.Entry::getValue, Math::min, TreeMap::new).", "casos": [{"teste": "List<Caravana> cs = List.of(\n    new Caravana(\"Otto\", List.of(\"sal\", \"seda\", \"lã\"), 9),\n    new Caravana(\"Lia\", List.of(\"ferro\", \"sal\"), 4),\n    new Caravana(\"Rui\", List.of(\"seda\", \"cobre\", \"ferro\"), 6));\nSystem.out.println(\"mercadorias: \" + Comercio.mercadorias(cs));\nSystem.out.println(\"quem leva seda: \" + Comercio.quemLeva(cs, \"seda\"));\nSystem.out.println(\"quem leva ouro: \" + Comercio.quemLeva(cs, \"ouro\"));\nSystem.out.println(Comercio.anuncio(cs, \"cobre\"));\nSystem.out.println(Comercio.anuncio(cs, \"ouro\"));\nSystem.out.println(\"prazos: \" + Comercio.prazoPorItem(cs));", "esperado": "mercadorias: [cobre, ferro, lã, sal, seda]\nquem leva seda: Optional[Otto]\nquem leva ouro: Optional.empty\nCOBRE: RUI\nOURO: NINGUÉM\nprazos: {cobre=6, ferro=4, lã=9, sal=4, seda=6}\n"}, {"teste": "List<Caravana> cs = List.of(\n    new Caravana(\"Ari\", List.of(\"trigo\"), 12),\n    new Caravana(\"Bia\", List.of(), 2),\n    new Caravana(\"Cid\", List.of(\"trigo\", \"mel\", \"vinho\"), 7),\n    new Caravana(\"Dora\", List.of(\"mel\"), 3));\nSystem.out.println(\"mercadorias: \" + Comercio.mercadorias(cs));\nSystem.out.println(Comercio.anuncio(cs, \"mel\"));\nSystem.out.println(\"prazos: \" + Comercio.prazoPorItem(cs));\nSystem.out.println(\"vazio: \" + Comercio.mercadorias(List.of()) + \" \" + Comercio.prazoPorItem(List.of()));", "esperado": "mercadorias: [mel, trigo, vinho]\nMEL: CID\nprazos: {mel=3, trigo=7, vinho=7}\nvazio: [] {}\n"}]}, {"id": "r10", "distrito": 3, "titulo": "A trilha iterável", "intro": "<p>O arquimago descreve caminhos com texto, como <code>\"LLSSO\"<\/code>. Seria ótimo percorrer o caminho com um for-each comum, recebendo uma posição por vez:<\/p>\n<pre>for (Coord p : new Trilha(inicio, \"LLSSO\")) { ... }<\/pre>\n<p>Qualquer classe que implemente <code>Iterable&lt;T&gt;<\/code> funciona no for-each. Ela só precisa de <code>iterator()<\/code>, que devolve um <code>Iterator&lt;T&gt;<\/code> novo a cada chamada, com <code>hasNext()<\/code> e <code>next()<\/code>. O jeito mais direto é uma <b>classe anônima<\/b> que guarda o próprio estado:<\/p>\n<pre>public Iterator&lt;Coord&gt; iterator() {\n    return new Iterator&lt;&gt;() {\n        int i = 0;\n        Coord atual = inicio;\n        public boolean hasNext() { ... }\n        public Coord next() { ... }\n    };\n}<\/pre>\n<p>O <code>Iterator<\/code> deve lançar <code>NoSuchElementException<\/code> se <code>next()<\/code> for chamado depois do fim. <code>Coord<\/code> e <code>Direcao<\/code> (com <code>Direcao.de(letra)<\/code>) vêm da estação.<\/p>", "task": "Crie <code>class Trilha implements Iterable&lt;Coord&gt;<\/code> com o construtor <code>Trilha(Coord inicio, String passos)<\/code>. O iterador entrega o início e depois a posição após cada passo (<code>N<\/code>, <code>S<\/code>, <code>L<\/code>, <code>O<\/code>), calculando na hora, um passo por <code>next()<\/code>. Cada chamada de <code>iterator()<\/code> começa do zero. Crie também <code>int comprimento()<\/code>, o número de posições (passos + 1). O golem seguirá a sua trilha.", "estacao": "record Coord(int l, int c) {\n    Coord mais(int dl, int dc) { return new Coord(l + dl, c + dc); }\n    int distancia(Coord o) { return Math.abs(l - o.l) + Math.abs(c - o.c); }\n}\n\nenum Direcao {\n    NORTE('N', -1, 0), LESTE('L', 0, 1), SUL('S', 1, 0), OESTE('O', 0, -1);\n\n    final char letra;\n    final int dl, dc;\n\n    Direcao(char letra, int dl, int dc) { this.letra = letra; this.dl = dl; this.dc = dc; }\n\n    Direcao horario() { return values()[(ordinal() + 1) % 4]; }\n    Direcao antiHorario() { return values()[(ordinal() + 3) % 4]; }\n    Direcao oposta() { return values()[(ordinal() + 2) % 4]; }\n    Coord aplicar(Coord c) { return c.mais(dl, dc); }\n\n    static Direcao de(char letra) {\n        for (Direcao d : values()) if (d.letra == letra) return d;\n        throw new IllegalArgumentException(\"direção inválida: \" + letra);\n    }\n}\n\nclass Mapa {\n    private final String[] linhas;\n\n    Mapa(String... linhas) { this.linhas = linhas; }\n\n    int altura() { return linhas.length; }\n    int largura() { return linhas[0].length(); }\n\n    char em(Coord p) {\n        if (p.l() < 0 || p.c() < 0 || p.l() >= altura() || p.c() >= largura()) return '#';\n        return linhas[p.l()].charAt(p.c());\n    }\n\n    boolean livre(Coord p) { return em(p) != '#'; }\n\n    Coord achar(char ch) {\n        for (int l = 0; l < altura(); l++) {\n            int c = linhas[l].indexOf(ch);\n            if (c >= 0) return new Coord(l, c);\n        }\n        return null;\n    }\n}", "oculto": "class Cena {\n    static void inicio(Coord p) { System.out.println(\"@pos \" + p.l() + \" \" + p.c()); }\n    static void virar(Direcao d) { System.out.println(\"@turn \" + d.letra); }\n    static Coord andar(Mapa m, Coord p, Direcao d) {\n        Coord n = new Coord(p.l() + d.dl, p.c() + d.dc);\n        if (!m.livre(n)) {\n            System.out.println(\"@crash \" + n.l() + \" \" + n.c() + \" \" + d.letra);\n            throw new IllegalStateException(\"o golem bateu numa muralha em (\" + n.l() + \", \" + n.c() + \")\");\n        }\n        System.out.println(\"@move \" + n.l() + \" \" + n.c() + \" \" + d.letra);\n        return n;\n    }\n}\n\nclass Seguidor {\n    static void seguir(Mapa m, Iterable<Coord> trilha) {\n        Coord anterior = null;\n        int n = 0;\n        for (Coord p : trilha) {\n            if (anterior == null) Cena.inicio(p);\n            else {\n                Direcao d = null;\n                for (Direcao x : Direcao.values()) if (x.aplicar(anterior).equals(p)) d = x;\n                if (d == null) throw new IllegalStateException(\"a trilha pulou de \" + anterior + \" para \" + p);\n                Cena.andar(m, anterior, d);\n            }\n            anterior = p;\n            n++;\n        }\n        System.out.println(\"posições percorridas: \" + n + \", fim em \" + anterior);\n        System.out.println(m.em(anterior) == '@' ? \"chegou ao destino\" : \"não chegou ao destino\");\n    }\n}", "starter": "import java.util.*;\n\nclass Trilha implements Iterable<Coord> {\n    private final Coord inicio;\n    private final String passos;\n\n    Trilha(Coord inicio, String passos) {\n        this.inicio = inicio;\n        this.passos = passos;\n    }\n\n    public Iterator<Coord> iterator() {\n        return List.of(inicio).iterator();\n    }\n}\n", "solution": "import java.util.*;\n\nclass Trilha implements Iterable<Coord> {\n    private final Coord inicio;\n    private final String passos;\n\n    Trilha(Coord inicio, String passos) {\n        this.inicio = inicio;\n        this.passos = passos;\n    }\n\n    int comprimento() {\n        return passos.length() + 1;\n    }\n\n    public Iterator<Coord> iterator() {\n        return new Iterator<>() {\n            int i = 0;\n            Coord atual = inicio;\n\n            public boolean hasNext() {\n                return i < comprimento();\n            }\n\n            public Coord next() {\n                if (!hasNext()) throw new NoSuchElementException();\n                if (i > 0) atual = Direcao.de(passos.charAt(i - 1)).aplicar(atual);\n                i++;\n                return atual;\n            }\n        };\n    }\n}\n", "hint": "Na classe anônima, guarde um contador i e a posição atual. hasNext() é i < comprimento(). Em next(): se não houver próximo, lance NoSuchElementException; se i > 0, avance atual com Direcao.de(passos.charAt(i - 1)).aplicar(atual); some 1 em i e devolva atual.", "casos": [{"teste": "Trilha t = new Trilha(new Coord(1, 1), \"LLS\");\nfor (Coord p : t) System.out.println(p);\nSystem.out.println(\"comprimento: \" + t.comprimento());\nIterator<Coord> it = t.iterator();\nit.next();\nSystem.out.println(\"de novo, o segundo: \" + it.next());\nIterator<Coord> fim = new Trilha(new Coord(0, 0), \"\").iterator();\nfim.next();\ntry {\n    fim.next();\n} catch (NoSuchElementException e) {\n    System.out.println(\"acabou a trilha\");\n}", "esperado": "Coord[l=1, c=1]\nCoord[l=1, c=2]\nCoord[l=1, c=3]\nCoord[l=2, c=3]\ncomprimento: 4\nde novo, o segundo: Coord[l=1, c=2]\nacabou a trilha\n"}, {"mapa": ["###########", "#S..#.....#", "#.#.#.###.#", "#.#...#...#", "#.#####.#.#", "#.......#@#", "###########"], "teste": "Mapa m = new Mapa(\"###########\", \"#S..#.....#\", \"#.#.#.###.#\", \"#.#...#...#\", \"#.#####.#.#\", \"#.......#@#\", \"###########\");\nSeguidor.seguir(m, new Trilha(m.achar('S'), \"LLSSLLNNLLLLSSSS\"));", "esperado": "@pos 1 1\n@move 1 2 L\n@move 1 3 L\n@move 2 3 S\n@move 3 3 S\n@move 3 4 L\n@move 3 5 L\n@move 2 5 N\n@move 1 5 N\n@move 1 6 L\n@move 1 7 L\n@move 1 8 L\n@move 1 9 L\n@move 2 9 S\n@move 3 9 S\n@move 4 9 S\n@move 5 9 S\nposições percorridas: 17, fim em Coord[l=5, c=9]\nchegou ao destino\n"}, {"mapa": ["#########", "#S......#", "#######.#", "#@......#", "#########"], "teste": "Mapa m = new Mapa(\"#########\", \"#S......#\", \"#######.#\", \"#@......#\", \"#########\");\nSeguidor.seguir(m, new Trilha(m.achar('S'), \"LLLLLLSSOOOOOO\"));", "esperado": "@pos 1 1\n@move 1 2 L\n@move 1 3 L\n@move 1 4 L\n@move 1 5 L\n@move 1 6 L\n@move 1 7 L\n@move 2 7 S\n@move 3 7 S\n@move 3 6 O\n@move 3 5 O\n@move 3 4 O\n@move 3 3 O\n@move 3 2 O\n@move 3 1 O\nposições percorridas: 15, fim em Coord[l=3, c=1]\nchegou ao destino\n"}]}, {"id": "r11", "distrito": 3, "titulo": "A forja de golens", "intro": "<p>Golens têm muitos atributos opcionais: nome, material, força, uma lista de habilidades. Um construtor com cinco parâmetros fica ilegível (<code>new Golem(\"Bruto\", \"ferro\", 80, ...)<\/code>: qual número é o quê?). O padrão <b>Builder<\/b> resolve: uma classe auxiliar recebe os valores um a um, com nomes, e só no fim monta o objeto:<\/p>\n<pre>Golem g = Golem.builder()\n        .nome(\"Bruto\")\n        .material(\"ferro\")\n        .forca(80)\n        .habilidade(\"esmagar\")\n        .build();<\/pre>\n<p>O <code>Builder<\/code> é uma <b>classe aninhada estática<\/b> dentro de <code>Golem<\/code> (<code>static class Builder<\/code>), e por isso pode usar o construtor privado de <code>Golem<\/code>. Cada método do builder devolve <code>this<\/code>, o que permite encadear. O <code>Golem<\/code> é <b>imutável<\/b>: sem setters, e a lista de habilidades exposta não pode ser alterada por fora (<code>List.copyOf<\/code>).<\/p>", "task": "Crie <code>Golem<\/code> com construtor <b>privado<\/b>, os métodos <code>nome()<\/code>, <code>material()<\/code>, <code>forca()<\/code>, <code>habilidades()<\/code> e <code>toString()<\/code> no formato <code>Golem[Bruto, ferro, força 80, [esmagar]]<\/code>, e <code>static Builder builder()<\/code>. O <code>Golem.Builder<\/code> tem <code>nome<\/code>, <code>material<\/code> (padrão <code>\"pedra\"<\/code>), <code>forca<\/code> (padrão 10; fora de 1 a 100, lança <code>IllegalArgumentException(\"força inválida: N\")<\/code>), <code>habilidade<\/code> (acumula) e <code>build()<\/code>, que lança <code>IllegalStateException(\"golem sem nome\")<\/code> sem nome.", "estacao": "", "starter": "import java.util.*;\n\nclass Golem {\n    private final String nome;\n\n    private Golem(String nome) {\n        this.nome = nome;\n    }\n\n    String nome() {\n        return nome;\n    }\n}\n", "solution": "import java.util.*;\n\nclass Golem {\n    private final String nome;\n    private final String material;\n    private final int forca;\n    private final List<String> habilidades;\n\n    private Golem(Builder b) {\n        this.nome = b.nome;\n        this.material = b.material;\n        this.forca = b.forca;\n        this.habilidades = List.copyOf(b.habilidades);\n    }\n\n    static Builder builder() {\n        return new Builder();\n    }\n\n    String nome() { return nome; }\n    String material() { return material; }\n    int forca() { return forca; }\n    List<String> habilidades() { return habilidades; }\n\n    public String toString() {\n        return \"Golem[\" + nome + \", \" + material + \", força \" + forca + \", \" + habilidades + \"]\";\n    }\n\n    static class Builder {\n        private String nome;\n        private String material = \"pedra\";\n        private int forca = 10;\n        private final List<String> habilidades = new ArrayList<>();\n\n        Builder nome(String nome) {\n            this.nome = nome;\n            return this;\n        }\n\n        Builder material(String material) {\n            this.material = material;\n            return this;\n        }\n\n        Builder forca(int forca) {\n            if (forca < 1 || forca > 100) throw new IllegalArgumentException(\"força inválida: \" + forca);\n            this.forca = forca;\n            return this;\n        }\n\n        Builder habilidade(String h) {\n            habilidades.add(h);\n            return this;\n        }\n\n        Golem build() {\n            if (nome == null) throw new IllegalStateException(\"golem sem nome\");\n            return new Golem(this);\n        }\n    }\n}\n", "hint": "O construtor privado do Golem pode receber o próprio Builder e copiar os campos (use List.copyOf para a lista). No Builder, cada método guarda o valor e faz return this. build() confere o nome e chama new Golem(this). builder() é só return new Builder().", "casos": [{"teste": "Golem g = Golem.builder().nome(\"Bruto\").material(\"ferro\").forca(80).habilidade(\"esmagar\").build();\nSystem.out.println(g);\nGolem simples = Golem.builder().nome(\"Pedrinho\").build();\nSystem.out.println(simples);\nSystem.out.println(simples.material() + \" \" + simples.forca() + \" \" + simples.habilidades().size());", "esperado": "Golem[Bruto, ferro, força 80, [esmagar]]\nGolem[Pedrinho, pedra, força 10, []]\npedra 10 0\n"}, {"teste": "Golem.Builder b = Golem.builder().nome(\"Sentinela\").habilidade(\"vigiar\");\nGolem g1 = b.build();\nb.habilidade(\"alarmar\");\nGolem g2 = b.build();\nSystem.out.println(g1.habilidades() + \" / \" + g2.habilidades());\ntry {\n    g2.habilidades().add(\"voar\");\n} catch (UnsupportedOperationException e) {\n    System.out.println(\"habilidades protegidas\");\n
