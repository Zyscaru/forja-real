}\ntry {\n    Golem.builder().forca(150);\n} catch (IllegalArgumentException e) {\n    System.out.println(e.getMessage());\n}\ntry {\n    Golem.builder().material(\"barro\").build();\n} catch (IllegalStateException e) {\n    System.out.println(e.getMessage());\n}", "esperado": "[vigiar] / [vigiar, alarmar]\nhabilidades protegidas\nforça inválida: 150\ngolem sem nome\n"}]}, {"id": "r12", "distrito": 3, "titulo": "O sino de alerta", "intro": "<p>Quando o sino da torre toca, vários setores precisam reagir: a guarda, os arqueiros, o escriba. O sino não deve conhecer cada um deles; ele só mantém uma lista de <b>ouvintes<\/b> e avisa todos. Esse é o padrão <b>Observer<\/b>, e com interfaces funcionais os ouvintes são simples lambdas:<\/p>\n<pre>Consumer&lt;String&gt; guarda = msg -&gt; System.out.println(\"guarda ouviu \" + msg);\nsino.inscrever(guarda);\nsino.tocar(\"invasão\");      // chama guarda.accept(\"invasão\")<\/pre>\n<p>Um detalhe elegante: <code>inscrever<\/code> pode devolver um <code>Runnable<\/code> que, quando executado, <b>cancela<\/b> aquela inscrição. A lambda devolvida \"lembra\" qual ouvinte remover. E <code>Predicate&lt;String&gt;<\/code> permite inscrições com filtro, montadas em cima de <code>inscrever<\/code>.<\/p>", "task": "Crie a classe <code>Sino<\/code> com: <code>Runnable inscrever(Consumer&lt;String&gt; ouvinte)<\/code>, que acrescenta o ouvinte e devolve um cancelador (rodar o cancelador de novo não faz nada); <code>int tocar(String mensagem)<\/code>, que avisa os ouvintes <b>na ordem de inscrição<\/b> e devolve quantos foram avisados; e <code>Runnable inscreverSe(Predicate&lt;String&gt; filtro, Consumer&lt;String&gt; ouvinte)<\/code>, que só repassa as mensagens aprovadas pelo filtro (mas conta como avisado em <code>tocar<\/code>, como qualquer inscrito).", "estacao": "", "starter": "import java.util.*;\nimport java.util.function.*;\n\nclass Sino {\n    private final List<Consumer<String>> ouvintes = new ArrayList<>();\n\n    int tocar(String mensagem) {\n        return 0;\n    }\n}\n", "solution": "import java.util.*;\nimport java.util.function.*;\n\nclass Sino {\n    private final List<Consumer<String>> ouvintes = new ArrayList<>();\n\n    Runnable inscrever(Consumer<String> ouvinte) {\n        Consumer<String> registro = msg -> ouvinte.accept(msg);\n        ouvintes.add(registro);\n        return () -> ouvintes.remove(registro);\n    }\n\n    Runnable inscreverSe(Predicate<String> filtro, Consumer<String> ouvinte) {\n        return inscrever(msg -> {\n            if (filtro.test(msg)) ouvinte.accept(msg);\n        });\n    }\n\n    int tocar(String mensagem) {\n        List<Consumer<String>> copia = new ArrayList<>(ouvintes);\n        for (Consumer<String> o : copia) o.accept(mensagem);\n        return copia.size();\n    }\n}\n", "hint": "Guarde os ouvintes numa lista. O cancelador é () -> ouvintes.remove(registro): remover algo que não está mais lá não faz nada. Se o mesmo ouvinte for inscrito duas vezes, cada cancelador deve tirar só uma das inscrições. inscreverSe chama inscrever com uma lambda que testa o filtro antes de repassar. Em tocar, percorra uma cópia da lista.", "casos": [{"teste": "Sino sino = new Sino();\nList<String> diario = new ArrayList<>();\nRunnable cancelaGuarda = sino.inscrever(m -> diario.add(\"guarda: \" + m));\nsino.inscrever(m -> diario.add(\"arqueiros: \" + m));\nSystem.out.println(\"avisados: \" + sino.tocar(\"fumaça ao norte\"));\ncancelaGuarda.run();\ncancelaGuarda.run();\nSystem.out.println(\"avisados: \" + sino.tocar(\"cavaleiros no portão\"));\ndiario.forEach(System.out::println);", "esperado": "avisados: 2\navisados: 1\nguarda: fumaça ao norte\narqueiros: fumaça ao norte\narqueiros: cavaleiros no portão\n"}, {"teste": "Sino sino = new Sino();\nList<String> diario = new ArrayList<>();\nsino.inscreverSe(m -> m.startsWith(\"URGENTE\"), m -> diario.add(\"rei: \" + m));\nConsumer<String> escriba = m -> diario.add(\"escriba: \" + m);\nRunnable c1 = sino.inscrever(escriba);\nsino.inscrever(escriba);\nSystem.out.println(\"avisados: \" + sino.tocar(\"chuva amanhã\"));\nSystem.out.println(\"avisados: \" + sino.tocar(\"URGENTE: dragão\"));\nc1.run();\nSystem.out.println(\"avisados: \" + sino.tocar(\"URGENTE: o dragão foi embora\"));\ndiario.forEach(System.out::println);", "esperado": "avisados: 3\navisados: 3\navisados: 2\nescriba: chuva amanhã\nescriba: chuva amanhã\nrei: URGENTE: dragão\nescriba: URGENTE: dragão\nescriba: URGENTE: dragão\nrei: URGENTE: o dragão foi embora\nescriba: URGENTE: o dragão foi embora\n"}]}, {"id": "r13", "distrito": 4, "titulo": "O bestiário", "intro": "<p>O bestiário real classifica as criaturas da masmorra. São só quatro tipos, e nenhum outro pode surgir: uma <b>interface selada<\/b> (<code>sealed<\/code>) declara exatamente quem pode implementá-la. Com isso, o <code>switch<\/code> sabe que cobriu todos os casos e dispensa o <code>default<\/code>.<\/p>\n<pre>sealed interface Criatura permits Goblin, Dragao, Esqueleto, Slime {}\nrecord Goblin(String nome, int forca) implements Criatura {}<\/pre>\n<p>O <b>pattern matching<\/b> testa o tipo, extrai os componentes e ainda aceita condições com <code>when<\/code>:<\/p>\n<pre>return switch (c) {\n    case Goblin g -&gt; g.forca();\n    case Dragao d when d.idade() &lt; 100 -&gt; ...;        // guarda\n    case Slime(int tam, Criatura dentro) -&gt; ...;       // desmonta o record\n    ...\n};<\/pre>", "task": "Crie <code>sealed interface Criatura<\/code> e os records <code>Goblin(String nome, int forca)<\/code>, <code>Dragao(String nome, int idade, boolean cospeFogo)<\/code>, <code>Esqueleto(int ossos)<\/code> e <code>Slime(int tamanho, Criatura engolida)<\/code>. Na classe <code>Bestiario<\/code>, <code>static int perigo(Criatura c)<\/code>: goblin = força; dragão = 50 se tiver menos de 100 anos, senão 100, e +50 se cospe fogo; esqueleto = ossos / 10; slime = tamanho + o perigo de quem engoliu (<code>engolida<\/code> pode ser <code>null<\/code>). E <code>static String descrever(Criatura c)<\/code>: <code>\"goblin Zek\"<\/code>, <code>\"dragão Ignis (cospe fogo)\"<\/code> ou <code>\"dragão Ignis\"<\/code>, <code>\"esqueleto de 206 ossos\"<\/code>, <code>\"slime vazio\"<\/code> ou <code>\"slime com goblin Zek\"<\/code>.", "estacao": "", "starter": "sealed interface Criatura permits Goblin, Dragao, Esqueleto, Slime {}\n\nrecord Goblin(String nome, int forca) implements Criatura {}\nrecord Dragao(String nome, int idade, boolean cospeFogo) implements Criatura {}\nrecord Esqueleto(int ossos) implements Criatura {}\nrecord Slime(int tamanho, Criatura engolida) implements Criatura {}\n\nclass Bestiario {\n    static int perigo(Criatura c) {\n        return 0;\n    }\n}\n", "solution": "sealed interface Criatura permits Goblin, Dragao, Esqueleto, Slime {}\n\nrecord Goblin(String nome, int forca) implements Criatura {}\nrecord Dragao(String nome, int idade, boolean cospeFogo) implements Criatura {}\nrecord Esqueleto(int ossos) implements Criatura {}\nrecord Slime(int tamanho, Criatura engolida) implements Criatura {}\n\nclass Bestiario {\n    static int perigo(Criatura c) {\n        return switch (c) {\n            case Goblin g -> g.forca();\n            case Dragao d -> (d.idade() < 100 ? 50 : 100) + (d.cospeFogo() ? 50 : 0);\n            case Esqueleto e -> e.ossos() / 10;\n            case Slime(int tamanho, Criatura dentro) -> tamanho + (dentro == null ? 0 : perigo(dentro));\n        };\n    }\n\n    static String descrever(Criatura c) {\n        return switch (c) {\n            case Goblin g -> \"goblin \" + g.nome();\n            case Dragao d when d.cospeFogo() -> \"dragão \" + d.nome() + \" (cospe fogo)\";\n            case Dragao d -> \"dragão \" + d.nome();\n            case Esqueleto e -> \"esqueleto de \" + e.ossos() + \" ossos\";\n            case Slime s when s.engolida() == null -> \"slime vazio\";\n            case Slime s -> \"slime com \" + descrever(s.engolida());\n        };\n    }\n}\n", "hint": "Um switch (c) com um case por record. No dragão, some as duas partes com operadores ternários. No slime, desmonte com case Slime(int tamanho, Criatura dentro) e cuide do null antes de chamar perigo de novo (recursão). Em descrever, use guardas: case Dragao d when d.cospeFogo() vem antes do case Dragao d geral.", "casos": [{"teste": "List<Criatura> masmorra = List.of(new Goblin(\"Zek\", 12), new Dragao(\"Ignis\", 340, true), new Dragao(\"Faísca\", 40, false),\n    new Esqueleto(206), new Slime(5, null));\nfor (Criatura c : masmorra) System.out.println(Bestiario.descrever(c) + \": perigo \" + Bestiario.perigo(c));", "esperado": "goblin Zek: perigo 12\ndragão Ignis (cospe fogo): perigo 150\ndragão Faísca: perigo 50\nesqueleto de 206 ossos: perigo 20\nslime vazio: perigo 5\n"}, {"teste": "Criatura matrioska = new Slime(3, new Slime(4, new Goblin(\"Nix\", 9)));\nSystem.out.println(Bestiario.descrever(matrioska) + \": perigo \" + Bestiario.perigo(matrioska));\nCriatura engoliuDragao = new Slime(10, new Dragao(\"Brasa\", 99, true));\nSystem.out.println(Bestiario.descrever(engoliuDragao) + \": perigo \" + Bestiario.perigo(engoliuDragao));\nSystem.out.println(\"é record? \" + (matrioska instanceof Record) + \", igual? \" + matrioska.equals(new Slime(3, new Slime(4, new Goblin(\"Nix\", 9)))));", "esperado": "slime com slime com goblin Nix: perigo 16\nslime com dragão Brasa (cospe fogo): perigo 110\né record? true, igual? true\n"}]}, {"id": "r14", "distrito": 4, "titulo": "Grimório e mana", "intro": "<p>Lançar um feitiço exige abrir o grimório, e o grimório <b>sempre<\/b> precisa ser fechado, dê certo ou não. O <b>try-with-resources<\/b> garante isso para qualquer objeto <code>AutoCloseable<\/code>, e fecha <b>antes<\/b> de rodar os <code>catch<\/code> e o <code>finally<\/code>:<\/p>\n<pre>try (Grimorio g = new Grimorio(\"arcano\")) {\n    ...\n} catch (IllegalArgumentException e) {      // o grimório já foi fechado aqui\n    throw new MagiaException(\"...\", e);      // embrulha a causa\n} finally {\n    ...\n}<\/pre>\n<p>Exceções <b>verificadas<\/b> (que herdam de <code>Exception<\/code>, não de <code>RuntimeException<\/code>) precisam ser declaradas com <code>throws<\/code>, e quem chama é obrigado a tratar. Encadear a causa original (<code>super(mensagem, causa)<\/code>) preserva a história do erro: <code>getCause()<\/code> devolve a exceção de dentro.<\/p>\n<p>A classe <code>Grimorio<\/code> e o <code>Diario<\/code> (que anota tudo) já vêm da estação.<\/p>", "task": "Crie <code>MagiaException extends Exception<\/code> (construtores <code>(String)<\/code> e <code>(String, Throwable)<\/code>) e <code>ManaInsuficiente extends MagiaException<\/code> (construtor <code>(int falta)<\/code>, mensagem <code>\"faltam N de mana\"<\/code>). Na classe <code>Mago<\/code> (construtor <code>Mago(int mana)<\/code>, método <code>int mana()<\/code>), escreva <code>String lancar(String livro, String feitico, int custo) throws MagiaException<\/code>: se faltar mana, lance <code>ManaInsuficiente<\/code> <b>sem abrir<\/b> o grimório; senão abra <code>new Grimorio(livro)<\/code> com try-with-resources, devolva <code>g.ler(feitico)<\/code> e desconte a mana só se der certo; se <code>ler<\/code> lançar <code>IllegalArgumentException<\/code>, lance <code>MagiaException(\"feitiço falhou: \" + feitico, e)<\/code>; e, em todo caso, anote <code>Diario.anotar(\"fim de \" + feitico)<\/code> no <code>finally<\/code>.", "estacao": "class Diario {\n    static final List<String> linhas = new ArrayList<>();\n    static void anotar(String s) { linhas.add(s); }\n}\n\nclass Grimorio implements AutoCloseable {\n    private final String livro;\n\n    Grimorio(String livro) {\n        this.livro = livro;\n        Diario.anotar(\"abre \" + livro);\n    }\n\n    String ler(String feitico) {\n        if (!feitico.matches(\"[a-z]+\")) throw new IllegalArgumentException(\"runas ilegíveis\");\n        Diario.anotar(\"lê \" + feitico);\n        return feitico.toUpperCase() + \"!\";\n    }\n\n    public void close() {\n        Diario.anotar(\"fecha \" + livro);\n    }\n}", "starter": "class MagiaException extends Exception {\n    MagiaException(String mensagem) {\n        super(mensagem);\n    }\n}\n\nclass Mago {\n    private int mana;\n\n    Mago(int mana) {\n        this.mana = mana;\n    }\n\n    int mana() {\n        return mana;\n    }\n\n    String lancar(String livro, String feitico, int custo) throws MagiaException {\n        Grimorio g = new Grimorio(livro);\n        return g.ler(feitico);\n    }\n}\n", "solution": "class MagiaException extends Exception {\n    MagiaException(String mensagem) {\n        super(mensagem);\n    }\n\n    MagiaException(String mensagem, Throwable causa) {\n        super(mensagem, causa);\n    }\n}\n\nclass ManaInsuficiente extends MagiaException {\n    ManaInsuficiente(int falta) {\n        super(\"faltam \" + falta + \" de mana\");\n    }\n}\n\nclass Mago {\n    private int mana;\n\n    Mago(int mana) {\n        this.mana = mana;\n    }\n\n    int mana() {\n        return mana;\n    }\n\n    String lancar(String livro, String feitico, int custo) throws MagiaException {\n        if (custo > mana) throw new ManaInsuficiente(custo - mana);\n        try (Grimorio g = new Grimorio(livro)) {\n            String efeito = g.ler(feitico);\n            mana -= custo;\n            return efeito;\n        } catch (IllegalArgumentException e) {\n            throw new MagiaException(\"feitiço falhou: \" + feitico, e);\n        } finally {\n            Diario.anotar(\"fim de \" + feitico);\n        }\n    }\n}\n", "hint": "Teste a mana antes do try (assim o grimório nem abre). Dentro de try (Grimorio g = new Grimorio(livro)) { ... } leia o feitiço, desconte a mana e devolva. No catch (IllegalArgumentException e), lance new MagiaException(\"feitiço falhou: \" + feitico, e). O finally anota o fim. ManaInsuficiente chama super(\"faltam \" + falta + \" de mana\").", "casos": [{"teste": "Mago m = new Mago(10);\nSystem.out.println(m.lancar(\"arcano\", \"luz\", 4) + \" mana restante: \" + m.mana());\ntry {\n    m.lancar(\"arcano\", \"trovão\", 9);\n} catch (ManaInsuficiente e) {\n    System.out.println(\"sem mana: \" + e.getMessage());\n}\nDiario.linhas.forEach(System.out::println);", "esperado": "LUZ! mana restante: 6\nsem mana: faltam 3 de mana\nabre arcano\nlê luz\nfecha arcano\nfim de luz\n"}, {"teste": "Mago m = new Mago(20);\ntry {\n    m.lancar(\"proibido\", \"x#y\", 5);\n} catch (MagiaException e) {\n    System.out.println(e.getMessage() + \" | causa: \" + e.getCause().getMessage());\n    System.out.println(\"mana intacta: \" + m.mana());\n}\nDiario.linhas.forEach(System.out::println);\nMagiaException falta = new ManaInsuficiente(3);\nSystem.out.println(falta.getMessage() + \" / é MagiaException? \" + (falta instanceof MagiaException));", "esperado": "feitiço falhou: x#y | causa: runas ilegíveis\nmana intacta: 20\nabre proibido\nfecha proibido\nfim de x#y\nfaltam 3 de mana / é MagiaException? true\n"}]}, {"id": "r15", "distrito": 4, "titulo": "Runas aritméticas", "intro": "<p>Os magos escrevem fórmulas como árvores de runas: uma soma tem duas runas filhas, que podem ser números, variáveis ou outras operações. Isso é uma <b>árvore de sintaxe<\/b>, e records selados a representam com perfeição:<\/p>\n<pre>sealed interface Expr permits Num, Var, Soma, Mult {}\nrecord Num(int valor) implements Expr {}\nrecord Soma(Expr esq, Expr dir) implements Expr {}\n// (x + 2) * 3:\nnew Mult(new Soma(new Var(\"x\"), new Num(2)), new Num(3))<\/pre>\n<p>Toda operação sobre a árvore é <b>recursiva<\/b>: avaliar uma soma é avaliar os dois lados e somar. O pattern matching com records aninhados permite reconhecer formas inteiras, como \"qualquer coisa vezes o número 1\": <code>case Mult(Expr e, Num(int v)) when v == 1 -&gt; ...<\/code>.<\/p>", "task": "Crie <code>sealed interface Expr<\/code> e os records <code>Num(int valor)<\/code>, <code>Var(String nome)<\/code>, <code>Soma(Expr esq, Expr dir)<\/code> e <code>Mult(Expr esq, Expr dir)<\/code>. Na classe <code>Runas<\/code>: <code>static int avaliar(Expr e, Map&lt;String, Integer&gt; valores)<\/code> (variável sem valor: <code>NoSuchElementException(\"variável x sem valor\")<\/code>); <code>static String mostrar(Expr e)<\/code>, com parênteses em toda soma e multiplicação, como <code>((x + 2) * 3)<\/code>; e <code>static Expr simplificar(Expr e)<\/code>, que simplifica os filhos primeiro e então: junta operações entre dois números num número só, troca <code>x + 0<\/code>, <code>0 + x<\/code>, <code>x * 1<\/code> e <code>1 * x<\/code> por <code>x<\/code>, e <code>x * 0<\/code> ou <code>0 * x<\/code> por <code>0<\/code>.", "estacao": "", "starter": "import java.util.*;\n\nsealed interface Expr permits Num, Var, Soma, Mult {}\n\nrecord Num(int valor) implements Expr {}\nrecord Var(String nome) implements Expr {}\nrecord Soma(Expr esq, Expr dir) implements Expr {}\nrecord Mult(Expr esq, Expr dir) implements Expr {}\n\nclass Runas {\n    static int avaliar(Expr e, Map<String, Integer> valores) {\n        return 0;\n    }\n}\n", "solution": "import java.util.*;\n\nsealed interface Expr permits Num, Var, Soma, Mult {}\n\nrecord Num(int valor) implements Expr {}\nrecord Var(String nome) implements Expr {}\nrecord Soma(Expr esq, Expr dir) implements Expr {}\nrecord Mult(Expr esq, Expr dir) implements Expr {}\n\nclass Runas {\n    static int avaliar(Expr e, Map<String, Integer> valores) {\n        return switch (e) {\n            case Num n -> n.valor();\n            case Var v -> {\n                if (!valores.containsKey(v.nome())) throw new NoSuchElementException(\"variável \" + v.nome() + \" sem valor\");\n                yield valores.get(v.nome());\n            }\n            case Soma s -> avaliar(s.esq(), valores) + avaliar(s.dir(), valores);\n            case Mult m -> avaliar(m.esq(), valores) * avaliar(m.dir(), valores);\n        };\n    }\n\n    static String mostrar(Expr e) {\n        return switch (e) {\n            case Num n -> String.valueOf(n.valor());\n            case Var v -> v.nome();\n            case Soma s -> \"(\" + mostrar(s.esq()) + \" + \" + mostrar(s.dir()) + \")\";\n            case Mult m -> \"(\" + mostrar(m.esq()) + \" * \" + mostrar(m.dir()) + \")\";\n        };\n    }\n\n    static Expr simplificar(Expr e) {\n        return switch (e) {\n            case Soma s -> somar(simplificar(s.esq()), simplificar(s.dir()));\n            case Mult m -> multiplicar(simplificar(m.esq()), simplificar(m.dir()));\n            default -> e;\n        };\n    }\n\n    private static Expr somar(Expr a, Expr b) {\n        if (a instanceof Num(int x) && b instanceof Num(int y)) return new Num(x + y);\n        if (a instanceof Num(int x) && x == 0) return b;\n        if (b instanceof Num(int y) && y == 0) return a;\n        return new Soma(a, b);\n    }\n\n    private static Expr multiplicar(Expr a, Expr b) {\n        if (a instanceof Num(int x) && b instanceof Num(int y)) return new Num(x * y);\n        if (a instanceof Num(int x) && x == 0 || b instanceof Num(int y) && y == 0) return new Num(0);\n        if (a instanceof Num(int x) && x == 1) return b;\n        if (b instanceof Num(int y) && y == 1) return a;\n        return new Mult(a, b);\n    }\n}\n", "hint": "avaliar e mostrar são um switch com um caso por record, chamando a si mesmos nos filhos. Em simplificar, simplifique esq e dir primeiro e só depois decida: dois Num viram um Num; zero e um somem conforme a regra. O padrão a instanceof Num(int x) ajuda a testar e extrair o valor ao mesmo tempo.", "casos": [{"teste": "Expr e = new Mult(new Soma(new Var(\"x\"), new Num(2)), new Num(3));\nSystem.out.println(Runas.mostrar(e));\nSystem.out.println(\"com x = 4: \" + Runas.avaliar(e, Map.of(\"x\", 4)));\nExpr f = new Soma(new Mult(new Var(\"a\"), new Var(\"b\")), new Var(\"a\"));\nSystem.out.println(Runas.mostrar(f) + \" = \" + Runas.avaliar(f, Map.of(\"a\", 3, \"b\", 5)));\ntry {\n    Runas.avaliar(f, Map.of(\"a\", 1));\n} catch (NoSuchElementException ex) {\n    System.out.println(ex.getMessage());\n}", "esperado": "((x + 2) * 3)\ncom x = 4: 18\n((a * b) + a) = 18\nvariável b sem valor\n"}, {"teste": "List<Expr> formulas = List.of(\n    new Soma(new Num(2), new Num(3)),\n    new Mult(new Var(\"x\"), new Soma(new Num(0), new Num(1))),\n    new Soma(new Mult(new Num(0), new Var(\"y\")), new Var(\"z\")),\n    new Mult(new Soma(new Var(\"a\"), new Num(0)), new Soma(new Num(4), new Num(-2))),\n    new Soma(new Mult(new Num(1), new Var(\"k\")), new Mult(new Num(2), new Num(5))));\nfor (Expr e : formulas) System.out.println(Runas.mostrar(e) + \"  →  \" + Runas.mostrar(Runas.simplificar(e)));\nSystem.out.println(Runas.simplificar(new Mult(new Num(3), new Num(1))).equals(new Num(3)));", "esperado": "(2 + 3)  →  5\n(x * (0 + 1))  →  x\n((0 * y) + z)  →  z\n((a + 0) * (4 + -2))  →  (a * 2)\n((1 * k) + (2 * 5))  →  (k + 10)\ntrue\n"}]}, {"id": "r16", "distrito": 5, "titulo": "O caminho mais barato", "intro": "<p>Atravessar o reino custa caro: estrada custa 1, grama (<code>g<\/code>) 2, floresta (<code>f<\/code>) 4 e pântano (<code>p<\/code>) 7 para <b>entrar<\/b> na casa. O caminho com menos passos nem sempre é o mais barato.<\/p>\n<p>O <b>algoritmo de Dijkstra<\/b> resolve: sempre expande a posição de <b>menor custo acumulado<\/b> até agora, usando uma <code>PriorityQueue<\/code>. Um record guarda cada entrada da fila:<\/p>\n<pre>record No(Coord pos, int custo) {}\nPriorityQueue&lt;No&gt; fila = new PriorityQueue&lt;&gt;(Comparator.comparingInt(No::custo));\nMap&lt;Coord, Integer&gt; melhor = new HashMap&lt;&gt;();          // menor custo conhecido\nMap&lt;Coord, Direcao&gt; veioPor = new HashMap&lt;&gt;();       // para remontar o caminho<\/pre>\n<p>Ao tirar da fila uma entrada mais cara do que o melhor já conhecido, ignore-a. No fim, refaça o caminho de trás para frente com <code>veioPor<\/code> e inverta (<code>Collections.reverse<\/code>). <code>Coord<\/code>, <code>Direcao<\/code> (com <code>oposta()<\/code> e <code>aplicar<\/code>), <code>Mapa<\/code> e <code>Terreno.custo(char)<\/code> vêm da estação.<\/p>", "task": "Crie a classe <code>Cartografo<\/code> com <code>static List&lt;Direcao&gt; rotaMaisBarata(Mapa m, Coord inicio, Coord fim)<\/code>, que devolve os passos do caminho de <b>menor custo total<\/b> (a soma de <code>Terreno.custo<\/code> de cada casa em que o golem entra). Muralhas <code>#<\/code> não podem ser atravessadas. O golem seguirá a sua rota.", "estacao": "record Coord(int l, int c) {\n    Coord mais(int dl, int dc) { return new Coord(l + dl, c + dc); }\n    int distancia(Coord o) { return Math.abs(l - o.l) + Math.abs(c - o.c); }\n}\n\nenum Direcao {\n    NORTE('N', -1, 0), LESTE('L', 0, 1), SUL('S', 1, 0), OESTE('O', 0, -1);\n\n    final char letra;\n    final int dl, dc;\n\n    Direcao(char letra, int dl, int dc) { this.letra = letra; this.dl = dl; this.dc = dc; }\n\n    Direcao horario() { return values()[(ordinal() + 1) % 4]; }\n    Direcao antiHorario() { return values()[(ordinal() + 3) % 4]; }\n    Direcao oposta() { return values()[(ordinal() + 2) % 4]; }\n    Coord aplicar(Coord c) { return c.mais(dl, dc); }\n}\n\nclass Mapa {\n    private final String[] linhas;\n\n    Mapa(String... linhas) { this.linhas = linhas; }\n\n    int altura() { return linhas.length; }\n    int largura() { return linhas[0].length(); }\n\n    char em(Coord p) {\n        if (p.l() < 0 || p.c() < 0 || p.l() >= altura() || p.c() >= largura()) return '#';\n        return linhas[p.l()].charAt(p.c());\n    }\n\n    boolean livre(Coord p) { return em(p) != '#'; }\n\n    Coord achar(char ch) {\n        for (int l = 0; l < altura(); l++) {\n            int c = linhas[l].indexOf(ch);\n            if (c >= 0) return new Coord(l, c);\n        }\n        return null;\n    }\n}\n\nclass Terreno {\n    static int custo(char ch) {\n        return switch (ch) {\n            case 'g' -> 2;\n            case 'f' -> 4;\n            case 'p' -> 7;\n            default -> 1;\n        };\n    }\n}", "oculto": "class Cena {\n    static void inicio(Coord p) { System.out.println(\"@pos \" + p.l() + \" \" + p.c()); }\n    static void virar(Direcao d) { System.out.println(\"@turn \" + d.letra); }\n    static Coord andar(Mapa m, Coord p, Direcao d) {\n        Coord n = new Coord(p.l() + d.dl, p.c() + d.dc);\n        if (!m.livre(n)) {\n            System.out.println(\"@crash \" + n.l() + \" \" + n.c() + \" \" + d.letra);\n            throw new IllegalStateException(\"o golem bateu numa muralha em (\" + n.l() + \", \" + n.c() + \")\");\n        }\n        System.out.println(\"@move \" + n.l() + \" \" + n.c() + \" \" + d.letra);\n        return n;\n    }\n}\n\nclass Rota {\n    static void percorrer(Mapa m, Coord ini, List<Direcao> rota, boolean comCusto) {\n        if (rota == null) throw new IllegalStateException(\"a rota veio null\");\n        Cena.inicio(ini);\n        Coord p = ini;\n        int custo = 0;\n        for (Direcao d : rota) {\n            p = Cena.andar(m, p, d);\n            custo += Terreno.custo(m.em(p));\n        }\n        System.out.println(m.em(p) == '@' ? \"chegou ao destino\" : \"parou em (\" + p.l() + \", \" + p.c() + \"), longe do destino\");\n        System.out.println(\"movimentos: \" + rota.size() + (comCusto ? \", custo: \" + custo : \"\"));\n    }\n}", "starter": "import java.util.*;\n\nclass Cartografo {\n    static List<Direcao> rotaMaisBarata(Mapa m, Coord inicio, Coord fim) {\n        return new ArrayList<>();\n    }\n}\n", "solution": "import java.util.*;\n\nclass Cartografo {\n    record No(Coord pos, int custo) {}\n\n    static List<Direcao> rotaMaisBarata(Mapa m, Coord inicio, Coord fim) {\n        PriorityQueue<No> fila = new PriorityQueue<>(Comparator.comparingInt(No::custo));\n        Map<Coord, Integer> melhor = new HashMap<>();\n        Map<Coord, Direcao> veioPor = new HashMap<>();\n        fila.add(new No(inicio, 0));\n        melhor.put(inicio, 0);\n        while (!fila.isEmpty()) {\n            No atual = fila.poll();\n            if (atual.pos().equals(fim)) break;\n            if (atual.custo() > melhor.get(atual.pos())) continue;\n            for (Direcao d : Direcao.values()) {\n                Coord prox = d.aplicar(atual.pos());\n                if (!m.livre(prox)) continue;\n                int custo = atual.custo() + Terreno.custo(m.em(prox));\n                if (custo < melhor.getOrDefault(prox, Integer.MAX_VALUE)) {\n                    melhor.put(prox, custo);\n                    veioPor.put(prox, d);\n                    fila.add(new No(prox, custo));\n                }\n            }\n        }\n        List<Direcao> rota = new ArrayList<>();\n        for (Coord p = fim; !p.equals(inicio); ) {\n            Direcao d = veioPor.get(p);\n            rota.add(d);\n            p = d.oposta().aplicar(p);\n        }\n        Collections.reverse(rota);\n        return rota;\n    }\n}\n", "hint": "Comece com a fila contendo (inicio, 0) e melhor = {inicio: 0}. Enquanto houver fila: tire o mais barato com poll(); se o custo dele for maior que melhor.get(pos), pule. Para cada Direcao, calcule a casa vizinha; se for livre e o novo custo (atual + Terreno.custo(m.em(prox))) for menor que o melhor conhecido, atualize melhor, veioPor e acrescente na fila. Para remontar, ande do fim para trás usando d.oposta().aplicar(p).", "casos": [{"mapa": ["##############", "#S..gggff....#", "#.##ffppf.##.#", "#..gfppppf.#.#", "##.#ggfppf.#.#", "#..#..gg...#.#", "#.###.##.###.#", "#....g...ppp@#", "##############"], "teste": "Mapa m = new Mapa(\"##############\", \"#S..gggff....#\", \"#.##ffppf.##.#\", \"#..gfppppf.#.#\", \"##.#ggfppf.#.#\", \"#..#..gg...#.#\", \"#.###.##.###.#\", \"#....g...ppp@#\", \"##############\");\nList<Direcao> rota = Cartografo.rotaMaisBarata(m, m.achar('S'), m.achar('@'));\nRota.percorrer(m, m.achar('S'), rota, true);", "esperado": "@pos 1 1\n@move 1 2 L\n@move 1 3 L\n@move 1 4 L\n@move 1 5 L\n@move 1 6 L\n@move 1 7 L\n@move 1 8 L\n@move 1 9 L\n@move 1 10 L\n@move 1 11 L\n@move 1 12 L\n@move 2 12 S\n@move 3 12 S\n@move 4 12 S\n@move 5 12 S\n@move 6 12 S\n@move 7 12 S\nchegou ao destino\nmovimentos: 17, custo: 26\n"}, {"mapa": ["################", "#S.ppppp.......#", "#.#ppppp.#####.#", "#.#ffggg.#...#.#", "#.##f###.#.#.#.#", "#...g...p..#...#", "####.##.#####p##", "#ggg.ff....pp..#", "#g####p#######.#", "#gggggp.......@#", "################"], "teste": "Mapa m = new Mapa(\"################\", \"#S.ppppp.......#\", \"#.#ppppp.#####.#\", \"#.#ffggg.#...#.#\", \"#.##f###.#.#.#.#\", \"#...g...p..#...#\", \"####.##.#####p##\", \"#ggg.ff....pp..#\", \"#g####p#######.#\", \"#gggggp.......@#\", \"################\");\nList<Direcao> rota = Cartografo.rotaMaisBarata(m, m.achar('S'), m.achar('@'));\nRota.percorrer(m, m.achar('S'), rota, true);", "esperado": "@pos 1 1\n@move 2 1 S\n@move 3 1 S\n@move 4 1 S\n@move 5 1 S\n@move 5 2 L\n@move 5 3 L\n@move 5 4 L\n@move 5 5 L\n@move 5 6 L\n@move 5 7 L\n@move 6 7 S\n@move 7 7 S\n@move 7 8 L\n@move 7 9 L\n@move 7 10 L\n@move 7 11 L\n@move 7 12 L\n@move 7 13 L\n@move 7 14 L\n@move 8 14 S\n@move 9 14 S\nchegou ao destino\nmovimentos: 21, custo: 34\n"}, {"mapa": ["#############", "#S.f.f.f.f..#", "#.#.#.#.#.#.#", "#pppppppppp.#", "#.#.#.#.#.#p#", "#.f.f.f.f.ff#", "#.#########.#", "#ggggggggg.@#", "#############"], "teste": "Mapa m = new Mapa(\"#############\", \"#S.f.f.f.f..#\", \"#.#.#.#.#.#.#\", \"#pppppppppp.#\", \"#.#.#.#.#.#p#\", \"#.f.f.f.f.ff#\", \"#.#########.#\", \"#ggggggggg.@#\", \"#############\");\nList<Direcao> rota = Cartografo.rotaMaisBarata(m, m.achar('S'), m.achar('@'));\nRota.percorrer(m, m.achar('S'), rota, true);", "esperado": "@pos 1 1\n@move 2 1 S\n@move 3 1 S\n@move 4 1 S\n@move 5 1 S\n@move 6 1 S\n@move 7 1 S\n@move 7 2 L\n@move 7 3 L\n@move 7 4 L\n@move 7 5 L\n@move 7 6 L\n@move 7 7 L\n@move 7 8 L\n@move 7 9 L\n@move 7 10 L\n@move 7 11 L\nchegou ao destino\nmovimentos: 16, custo: 31\n"}]}, {"id": "r17", "distrito": 5, "titulo": "A ordem das obras", "intro": "<p>O rei quer reconstruir a cidadela, mas há dependências: a muralha precisa das fundações, a torre precisa da muralha e da escada... Qual ordem respeita todas? É uma <b>ordenação topológica<\/b>.<\/p>\n<p>O algoritmo de Kahn: conte, para cada obra, quantas dependências ainda faltam. As que não dependem de nada podem começar. Ao concluir uma obra, ela deixa de faltar para as que dependiam dela; quem chegar a zero entra na fila. Para que a resposta seja única, quando várias obras estiverem liberadas ao mesmo tempo, escolha a primeira em <b>ordem alfabética<\/b>: uma <code>PriorityQueue&lt;String&gt;<\/code> faz isso sozinha.<\/p>\n<pre>Map&lt;String, Integer&gt; faltam = new TreeMap&lt;&gt;();         // obra → nº de pré-requisitos pendentes\nMap&lt;String, List&lt;String&gt;&gt; liberam = new HashMap&lt;&gt;();  // pré-requisito → obras que dependem dele\nPriorityQueue&lt;String&gt; prontas = new PriorityQueue&lt;&gt;();<\/pre>\n<p>Se sobrarem obras que nunca chegam a zero, há um <b>ciclo<\/b> (A precisa de B, que precisa de A) e não existe ordem possível.<\/p>", "task": "Crie a classe <code>Obras<\/code> com <code>static List&lt;String&gt; ordem(Map&lt;String, List&lt;String&gt;&gt; dependencias)<\/code>: cada chave é uma obra e a lista são os pré-requisitos dela. Obras que só aparecem como pré-requisito também entram na resposta. Devolva uma ordem em que cada obra vem depois dos seus pré-requisitos, escolhendo sempre a primeira em ordem alfabética entre as liberadas. Se houver ciclo, lance <code>IllegalStateException(\"ciclo nas obras: [...]\")<\/code> com as obras que ficaram de fora, em ordem alfabética.", "estacao": "", "starter": "import java.util.*;\n\nclass Obras {\n    static List<String> ordem(Map<String, List<String>> dependencias) {\n        return new ArrayList<>(new TreeSet<>(dependencias.keySet()));\n    }\n}\n", "solution": "import java.util.*;\n\nclass Obras {\n    static List<String> ordem(Map<String, List<String>> dependencias) {\n        Map<String, Integer> faltam = new TreeMap<>();\n        Map<String, List<String>> liberam = new HashMap<>();\n        for (var e : dependencias.entrySet()) {\n            faltam.merge(e.getKey(), 0, Integer::sum);\n            for (String pre : e.getValue()) {\n                faltam.merge(pre, 0, Integer::sum);\n                faltam.merge(e.getKey(), 1, Integer::sum);\n                liberam.computeIfAbsent(pre, k -> new ArrayList<>()).add(e.getKey());\n            }\n        }\n        PriorityQueue<String> prontas = new PriorityQueue<>();\n        faltam.forEach((obra, n) -> { if (n == 0) prontas.add(obra); });\n        List<String> ordem = new ArrayList<>();\n        while (!prontas.isEmpty()) {\n            String obra = prontas.poll();\n            ordem.add(obra);\n            for (String depois : liberam.getOrDefault(obra, List.of())) {\n                if (faltam.merge(depois, -1, Integer::sum) == 0) prontas.add(depois);\n            }\n        }\n        if (ordem.size() < faltam.size()) {\n            List<String> presas = new ArrayList<>(faltam.keySet());\n            presas.removeAll(ordem);\n            throw new IllegalStateException(\"ciclo nas obras: \" + presas);\n        }\n        return ordem;\n    }\n}\n", "hint": "Monte dois mapas: faltam (quantos pré-requisitos cada obra ainda espera; coloque também as que só aparecem como pré-requisito, com 0) e liberam (pré-requisito → obras que dependem dele). merge(chave, valor, Integer::sum) ajuda a contar. Coloque na PriorityQueue as que têm 0. Ao tirar uma obra, diminua 1 de cada obra que ela libera e enfileire quem chegar a 0. Se a ordem final tiver menos obras que o mapa, há ciclo.", "casos": [{"teste": "Map<String, List<String>> plano = new LinkedHashMap<>();\nplano.put(\"torre\", List.of(\"muralha\", \"escada\"));\nplano.put(\"muralha\", List.of(\"fundação\"));\nplano.put(\"escada\", List.of(\"fundação\"));\nplano.put(\"portão\", List.of(\"muralha\"));\nplano.put(\"bandeira\", List.of(\"torre\"));\nSystem.out.println(Obras.ordem(plano));", "esperado": "[fundação, escada, muralha, portão, torre, bandeira]\n"}, {"teste": "Map<String, List<String>> plano = new LinkedHashMap<>();\nplano.put(\"estábulo\", List.of());\nplano.put(\"forja\", List.of(\"mina\", \"carvoaria\"));\nplano.put(\"armaria\", List.of(\"forja\"));\nplano.put(\"carvoaria\", List.of(\"serraria\"));\nplano.put(\"celeiro\", List.of());\nSystem.out.println(Obras.ordem(plano));\nSystem.out.println(Obras.ordem(Map.of()));", "esperado": "[celeiro, estábulo, mina, serraria, carvoaria, forja, armaria]\n[]\n"}, {"teste": "Map<String, List<String>> plano = new LinkedHashMap<>();\nplano.put(\"ponte\", List.of(\"pedreira\"));\nplano.put(\"pedreira\", List.of(\"estrada\"));\nplano.put(\"estrada\", List.of(\"ponte\"));\nplano.put(\"poço\", List.of());\nplano.put(\"moinho\", List.of(\"ponte\"));\ntry {\n    Obras.ordem(plano);\n} catch (IllegalStateException e) {\n    System.out.println(e.getMessage());\n}", "esperado": "ciclo nas obras: [estrada, moinho, pedreira, ponte]\n"}]}, {"id": "r18", "distrito": 5, "titulo": "O resgate na torre", "intro": "<p>A princesa está presa no alto da torre (<code>@<\/code>). O caminho tem portas trancadas <code>A<\/code>, <code>B<\/code> e <code>C<\/code>, que só abrem para quem já pegou a chave de mesma letra (<code>a<\/code>, <code>b<\/code>, <code>c<\/code>). As chaves são recolhidas ao passar por cima.<\/p>\n<p>A busca em largura (BFS) acha o menor caminho, mas aqui a posição sozinha não descreve a situação: estar na mesma casa <b>com<\/b> ou <b>sem<\/b> a chave b são situações diferentes. O <b>estado<\/b> da busca é a posição mais o conjunto de chaves. Como só há três chaves, o conjunto cabe num <code>int<\/code> de bits (<b>bitmask<\/b>), e um record faz a chave do mapa de visitados:<\/p>\n<pre>record Estado(Coord pos, int chaves) {}     // equals e hashCode prontos\nint bit = 1 &lt;&lt; (ch - 'a');                  // a → 1, b → 2, c → 4\nboolean tem = (chaves &amp; bit) != 0;          // já tenho essa chave?\nint novas = chaves | bit;                   // pego a chave<\/pre>\n<p>Guarde de onde cada estado veio (<code>Map&lt;Estado, Estado&gt;<\/code> e <code>Map&lt;Estado, Direcao&gt;<\/code>) para remontar a rota no fim.<\/p>", "task": "Crie a classe <code>Resgate<\/code> com <code>static List&lt;Direcao&gt; rota(Mapa m, Coord inicio)<\/code>, que devolve o <b>menor<\/b> número de passos até o <code>@<\/code>, pegando as chaves necessárias pelo caminho. Muralhas <code>#<\/code> nunca abrem; uma porta maiúscula só pode ser atravessada se a chave minúscula correspondente já tiver sido pega.", "estacao": "record Coord(int l, int c) {\n    Coord mais(int dl, int dc) { return new Coord(l + dl, c + dc); }\n    int distancia(Coord o) { return Math.abs(l - o.l) + Math.abs(c - o.c); }\n}\n\nenum Direcao {\n    NORTE('N', -1, 0), LESTE('L', 0, 1), SUL('S', 1, 0), OESTE('O', 0, -1);\n\n    final char letra;\n    final int dl, dc;\n\n    Direcao(char letra, int dl, int dc) { this.letra = letra; this.dl = dl; this.dc = dc; }\n\n    Direcao horario() { return values()[(ordinal() + 1) % 4]; }\n    Direcao antiHorario() { return values()[(ordinal() + 3) % 4]; }\n    Direcao oposta() { return values()[(ordinal() + 2) % 4]; }\n    Coord aplicar(Coord c) { return c.mais(dl, dc); }\n}\n\nclass Mapa {\n    private final String[] linhas;\n\n    Mapa(String... linhas) { this.linhas = linhas; }\n\n    int altura() { return linhas.length; }\n    int largura() { return linhas[0].length(); }\n\n    char em(Coord p) {\n        if (p.l() < 0 || p.c() < 0 || p.l() >= altura() || p.c() >= largura()) return '#';\n        return linhas[p.l()].charAt(p.c());\n    }\n\n    boolean livre(Coord p) { return em(p) != '#'; }\n\n    Coord achar(char ch) {\n        for (int l = 0; l < altura(); l++) {\n            int c = linhas[l].indexOf(ch);\n            if (c >= 0) return new Coord(l, c);\n        }\n        return null;\n    }\n}", "oculto": "class Cena {\n    static void inicio(Coord p) { System.out.println(\"@pos \" + p.l() + \" \" + p.c()); }\n    static void virar(Direcao d) { System.out.println(\"@turn \" + d.letra); }\n    static Coord andar(Mapa m, Coord p, Direcao d) {\n        Coord n = new Coord(p.l() + d.dl, p.c() + d.dc);\n        if (!m.livre(n)) {\n            System.out.println(\"@crash \" + n.l() + \" \" + n.c() + \" \" + d.letra);\n            throw new IllegalStateException(\"o golem bateu numa muralha em (\" + n.l() + \", \" + n.c() + \")\");\n        }\n        System.out.println(\"@move \" + n.l() + \" \" + n.c() + \" \" + d.letra);\n        return n;\n    }\n}\n\nclass Torre {\n    static void percorrer(Mapa m, Coord ini, List<Direcao> rota) {\n        if (rota == null) throw new IllegalStateException(\"a rota veio null\");\n        Cena.inicio(ini);\n        Coord p = ini;\n        Set<Character> chaves = new TreeSet<>();\n        for (Direcao d : rota) {\n            Coord n = d.aplicar(p);\n            char ch = m.em(n);\n            if (ch >= 'A' && ch <= 'C' && !chaves.contains(Character.toLowerCase(ch)))\n                throw new IllegalStateException(\"a porta \" + ch + \" está trancada: falta a chave \" + Character.toLowerCase(ch));\n            p = Cena.andar(m, p, d);\n            if (ch >= 'a' && ch <= 'c' && chaves.add(ch)) System.out.println(\"@key \" + p.l() + \" \" + p.c() + \" \" + ch);\n        }\n        System.out.println(m.em(p) == '@' ? \"princesa resgatada\" : \"parou longe da torre\");\n        System.out.println(\"passos: \" + rota.size() + \", chaves: \" + chaves);\n    }\n}", "starter": "import java.util.*;\n\nclass Resgate {\n    record Estado(Coord pos, int chaves) {}\n\n    static List<Direcao> rota(Mapa m, Coord inicio) {\n        return new ArrayList<>();\n    }\n}\n", "solution": "import java.util.*;\n\nclass Resgate {\n    record Estado(Coord pos, int chaves) {}\n\n    static List<Direcao> rota(Mapa m, Coord inicio) {\n        Estado comeco = new Estado(inicio, 0);\n        Map<Estado, Estado> anterior = new HashMap<>();\n        Map<Estado, Direcao> passo = new HashMap<>();\n        Set<Estado> vistos = new HashSet<>(Set.of(comeco));\n        Deque<Estado> fila = new ArrayDeque<>(List.of(comeco));\n        while (!fila.isEmpty()) {\n            Estado e = fila.poll();\n            if (m.em(e.pos()) == '@') {\n                List<Direcao> rota = new ArrayList<>();\n                for (Estado x = e; !x.equals(comeco); x = anterior.get(x)) rota.add(passo.get(x));\n                Collections.reverse(rota);\n                return rota;\n            }\n            for (Direcao d : Direcao.values()) {\n                Coord prox = d.aplicar(e.pos());\n                char ch = m.em(prox);\n                if (ch == '#') continue;\n                if (ch >= 'A' && ch <= 'C' && (e.chaves() & (1 << (ch - 'A'))) == 0) continue;\n                int chaves = ch >= 'a' && ch <= 'c' ? e.chaves() | (1 << (ch - 'a')) : e.chaves();\n                Estado novo = new Estado(prox, chaves);\n                if (vistos.add(novo)) {\n                    anterior.put(novo, e);\n                    passo.put(novo, d);\n                    fila.add(novo);\n                }\n            }\n        }\n        return List.of();\n    }\n}\n", "hint": "É uma BFS normal (ArrayDeque como fila), mas os nós são Estado(pos, chaves). Ao olhar um vizinho: muralha → pula; porta → só passa se (chaves & (1 << (ch - 'A'))) != 0; chave → o novo estado tem chaves | (1 << (ch - 'a')). Use vistos.add(novo) para saber se é novo. Quando tirar da fila um estado no '@', remonte a rota andando por anterior até o começo e inverta.", "casos": [{"mapa": ["#############", "#S....#...b.#", "#.###.#.###.#", "#.#a..#.#...#", "#.#######.###", "#.......A...#", "###########.#", "#@....B.....#", "#############"], "teste": "Mapa m = new Mapa(\"#############\", \"#S....#...b.#\", \"#.###.#.###.#\", \"#.#a..#.#...#\", \"#.#######.###\", \"#.......A...#\", \"###########.#\", \"#@....B.....#\", \"#############\");\nTorre.percorrer(m, m.achar('S'), Resgate.rota(m, m.achar('S')));", "esperado": "@pos 1 1\n@move 1 2 L\n@move 1 3 L\n@move 1 4 L\n@move 1 5 L\n@move 2 5 S\n@move 3 5 S\n@move 3 4 O\n@move 3 3 O\n@key 3 3 a\n@move 3 4 L\n@move 3 5 L\n@move 2 5 N\n@move 1 5 N\n@move 1 4 O\n@move 1 3 O\n@move 1 2 O\n@move 1 1 O\n@move 2 1 S\n@move 3 1 S\n@move 4 1 S\n@move 5 1 S\n@move 5 2 L\n@move 5 3 L\n@move 5 4 L\n@move 5 5 L\n@move 5 6 L\n@move 5 7 L\n@move 5 8 L\n@move 5 9 L\n@move 4 9 N\n@move 3 9 N\n@move 3 10 L\n@move 3 11 L\n@move 2 11 N\n@move 1 11 N\n@move 1 10 O\n@key 1 10 b\n@move 1 11 L\n@move 2 11 S\n@move 3 11 S\n@move 3 10 O\n@move 3 9 O\n@move 4 9 S\n@move 5 9 S\n@move 5 10 L\n@move 5 11 L\n@move 6 11 S\n@move 7 11 S\n@move 7 10 O\n@move 7 9 O\n@move 7 8 O\n@move 7 7 O\n@move 7 6 O\n@move 7 5 O\n@move 7 4 O\n@move 7 3 O\n@move 7 2 O\n@move 7 1 O\nprincesa resgatada\npassos: 56, chaves: [a, b]\n"}, {"mapa": ["###############", "#S..#....c....#", "#.#.#.##.####.#", "#.#a#..#...#..#", "#.###.##.#.#.##", "#.....A..#.#..#", "######.###.##.#", "#@..C.....B...#", "#####b#########", "###############"], "teste": "Mapa m = new Mapa(\"###############\", \"#S..#....c....#\", \"#.#.#.##.####.#\", \"#.#a#..#...#..#\", \"#.###.##.#.#.##\", \"#.....A..#.#..#\", \"######.###.##.#\", \"#@..C.....B...#\", \"#####b#########\", \"###############\");\nTorre.percorrer(m, m.achar('S'), Resgate.rota(m, m.achar('S')));", "esperado": "@pos 1 1\n@move 1 2 L\n@move 1 3 L\n@move 2 3 S\n@move 3 3 S\n@key 3 3 a\n@move 2 3 N\n@move 1 3 N\n@move 1 2 O\n@move 1 1 O\n@move 2 1 S\n@move 3 1 S\n@move 4 1 S\n@move 5 1 S\n@move 5 2 L\n@move 5 3 L\n@move 5 4 L\n@move 5 5 L\n@move 4 5 N\n@move 3 5 N\n@move 2 5 N\n@move 1 5 N\n@move 1 6 L\n@move 1 7 L\n@move 1 8 L\n@move 1 9 L\n@key 1 9 c\n@move 1 8 O\n@move 2 8 S\n@move 3 8 S\n@move 4 8 S\n@move 5 8 S\n@move 5 7 O\n@move 5 6 O\n@move 6 6 S\n@move 7 6 S\n@move 7 5 O\n@move 7 4 O\n@move 7 3 O\n@move 7 2 O\n@move 7 1 O\nprincesa resgatada\npassos: 38, chaves: [a, c]\n"}, {"mapa": ["##############", "#S..A..#..b..#", "#.##.#.#.###.#", "#a.#.#...#B..#", "####.#####.#.#", "#c...C......@#", "##############"], "teste": "Mapa m = new Mapa(\"##############\", \"#S..A..#..b..#\", \"#.##.#.#.###.#\", \"#a.#.#...#B..#\", \"####.#####.#.#\", \"#c...C......@#\", \"##############\");\nTorre.percorrer(m, m.achar('S'), Resgate.rota(m, m.achar('S')));", "esperado": "@pos 1 1\n@move 2 1 S\n@move 3 1 S\n@key 3 1 a\n@move 2 1 N\n@move 1 1 N\n@move 1 2 L\n@move 1 3 L\n@move 1 4 L\n@move 1 5 L\n@move 1 6 L\n@move 2 6 S\n@move 3 6 S\n@move 3 7 L\n@move 3 8 L\n@move 2 8 N\n@move 1 8 N\n@move 1 9 L\n@move 1 10 L\n@key 1 10 b\n@move 1 11 L\n@move 1 12 L\n@move 2 12 S\n@move 3 12 S\n@move 4 12 S\n@move 5 12 S\nprincesa resgatada\npassos: 23, chaves: [a, b]\n"}]}], "header": "import java.util.*; import java.util.function.*; import java.util.stream.*; "};

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("fr:"+k); return v===null ? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem("fr:"+k, JSON.stringify(v)); }catch(e){} }
};
const DISTRITOS = DADOS.distritos, MISSOES = DADOS.missoes;
function linhasDeCodigo(code){
  let n = 0, bloco = false;
  for (const raw of code.split("\n")){
    let t = raw.trim();
    if (bloco){ if (t.includes("*/")) bloco = false; continue; }
    if (t.startsWith("/*")){ if (!t.includes("*/")) bloco = true; continue; }
    if (!t || t.startsWith("//") || t.startsWith("import ") || t.startsWith("@") || /^[{}();]+$/.test(t)) continue;
    n++;
  }
  return n;
}
MISSOES.forEach(m => { m.par = linhasDeCodigo(m.solution) + 2; });
let stars = store.get("stars", {});
let speed = store.get("speed", 160);
let runId = 0;
let cur = null, running = false, abort = false, attempts = 0, shownMap = 0, mapStatus = [];
const isPhone = () => window.matchMedia("(max-width:1020px)").matches;
const starsFor = (m, code) => { const n = linhasDeCodigo(code); return n <= m.par ? 3 : n <= Math.ceil(m.par*1.4) ? 2 : 1; };
const unlocked = i => i===0 || (stars[MISSOES[i-1].id]||0) > 0;
const totalStars = () => Object.values(stars).reduce((a,b)=>a+b,0);
const starsHtml = n => [1,2,3].map(i=>`<span class="${i<=n?"on":""}">★</span>`).join("");
function updateStarCount(){ $("#starCount").textContent = `${totalStars()} / ${MISSOES.length*3}`; }
const ROMANOS = ["I","II","III","IV","V","VI"];

/* ---------------- mapa de missões ---------------- */
function showLevels(){
  stopRun(); cur = null; store.set("cur", null);
  const nextI = MISSOES.findIndex(m=>!(stars[m.id]>0));
  $("#view").innerHTML = `<div class="levels">
    <div class="card intro-card"><div><p><strong>Reino de Valdória.</strong> Você é o engenheiro da corte, e o conselho real julga cada peça de código que sai da sua forja. Aqui o Java vai além do básico: genéricos, records, enums com comportamento, streams, padrões de projeto, interfaces seladas, pattern matching e algoritmos de verdade guiando os golens pelo reino.</p>
    <p class="pre">Pré-requisito: Java intermediário (classes, interfaces, coleções, exceções e recursão), como na Missão Europa. O conselho compara a saída do seu código, linha por linha, com a do Java de verdade.</p></div>
    ${nextI>=0?`<button class="btn primary" id="playNext">${totalStars()?"Continuar":"Começar"}: missão ${nextI+1} →</button>`:`<b>O reino é seu!</b>`}</div>
    ${DISTRITOS.map((z,zi)=>`<section class="card world"><div class="num">${ROMANOS[zi]}</div><h2>${esc(z.titulo)}</h2><p>${esc(z.ideia)}</p><div class="tiles">
      ${MISSOES.map((m,i)=>({m,i})).filter(o=>o.m.distrito===zi).map(({m,i})=>`<button class="tile ${i===nextI?"next":""}" data-i="${i}" ${unlocked(i)?"":"disabled"}><span class="n">MISSÃO ${i+1}${unlocked(i)?"":" · 🔒"}</span><b>${esc(m.titulo)}</b><span class="s">${starsHtml(stars[m.id]||0)}</span></button>`).join("")}
    </div></section>`).join("")}
  </div>`;
  $("#view").querySelectorAll(".tile").forEach(b=>b.onclick=()=>openLevel(+b.dataset.i));
  const p = $("#playNext"); if (p) p.onclick = ()=>openLevel(nextI);
  window.scrollTo({top:0});
}
$("#levelsBtn").onclick = showLevels;

/* ---------------- missão ---------------- */
let codeEl, gutterEl, fbEl;
function referencia(m){
  const partes = [];
  if (m.estacao && m.estacao.trim()) partes.push(`<div><b>Código que a corte já fornece</b> (vem junto do seu, não precisa copiar)<pre>${esc(m.estacao.trim())}</pre></div>`);
  partes.push(`<div><b>Como o conselho julga</b>: cada teste é um trecho de código que usa as suas classes e imprime resultados. A saída precisa ser igual, linha por linha, à do Java de verdade com a solução da corte. Não escreva <code>public class</code> nem <code>main</code>: o conselho cria o <code>Main</code>.</div>`);
  if (m.casos.some(c=>c.mapa)) partes.push(`<div><b>Coordenadas</b>: <code>Coord(l, c)</code> é (linha, coluna), a partir de 0 no canto de cima à esquerda. <code>#</code> é muralha.</div>`);
  return `<details class="ref"><summary>Referência da corte</summary><div class="refbody">${partes.join("")}</div></details>`;
}
function openLevel(i){
  stopRun();
  if (!unlocked(i)) return showLevels();
  cur = i; store.set("cur", i); attempts = 0; shownMap = 0;
  const m = MISSOES[i];
  mapStatus = m.casos.map(()=>null);
  $("#view").innerHTML = ""; $("#view").appendChild($("#gameTpl").content.cloneNode(true));
  codeEl = $("#code"); gutterEl = $("#gutter"); fbEl = $("#feedback");
  const z = DISTRITOS[m.distrito];
  $("#mission").innerHTML = `<div class="eyebrow">${ROMANOS[m.distrito]} · ${esc(z.titulo)}<span class="num">missão ${i+1}</span></div>
    <h1>${esc(m.titulo)}</h1>${m.intro}
    <div class="task"><strong>Ordem da corte</strong><p>${m.task}</p></div>
    ${referencia(m)}
    <div class="goal"><span>3 estrelas: <b>até ${m.par} linhas</b> (sem contar comentários, imports, anotações e linhas só com chaves)</span><span>Julgado em <b>${m.casos.length} teste${m.casos.length>1?"s":""}</b></span><span>Melhor: <b style="color:var(--star)">${"★".repeat(stars[m.id]||0)||"—"}</b></span></div>`;
  codeEl.value = store.get("code:"+m.id, m.starter);
  setupEditor(); setupKeys();
  document.querySelectorAll(".speed button").forEach(b=>{
    b.setAttribute("aria-pressed", +b.dataset.speed===speed);
    b.onclick = ()=>{ speed = +b.dataset.speed; store.set("speed", speed); document.querySelectorAll(".speed button").forEach(x=>x.setAttribute("aria-pressed", x===b)); };
  });
  $("#run").onclick = runAll;
  $("#stop").onclick = ()=>{ abort = true; };
  $("#reset").onclick = ()=>{ codeEl.value = m.starter; syncGutter(); saveCode(); fbEl.innerHTML=""; resetBoard(); };
  renderLegend(m); renderMaps(); resetBoard();
  window.scrollTo({top:0});
}
function renderLegend(m){

let B = {};
function cellSize(mapa){
  const stage = $("#stage"); const w = mapa[0].length, h = mapa.length;
  const avail = stage.clientWidth - 20;
  const maxH = isPhone() ? window.innerHeight*0.5 : window.innerHeight*0.6;
  return Math.max(14, Math.min(50, Math.floor(avail / w), Math.floor(maxH / h)));
}
const CUSTO = { g:2, f:4, p:7 };
function cellHtml(ch, l, c){
  if (ch === "#") return `<div class="cell w ${(l*7+c*3)%2?"v2":""}" data-c="${l},${c}"></div>`;
  let cls = "f0" + ((l+c)%2 ? " alt" : ""), inner = "";
  if (ch === "g") cls = "tg"; else if (ch === "f") cls = "tf"; else if (ch === "p") cls = "tp";
  if (CUSTO[ch]) inner = `<span class="cost">${CUSTO[ch]}</span>`;
  if (ch === "S") inner = `<span class="start"></span>`;
  else if (ch === "@") inner = TOWER_SVG;
  else if (ch >= "a" && ch <= "c") inner = `<span class="kk" style="--k:var(--key-${ch});color:var(--key-${ch})" data-key="${l},${c}">${KEY_SVG}</span>`;
  else if (ch >= "A" && ch <= "C") inner = `<span class="door" style="--k:var(--key-${ch.toLowerCase()})" data-door="${ch.toLowerCase()}"><b>${ch}</b></span>`;
  return `<div class="cell ${cls}" data-c="${l},${c}">${inner}</div>`;
}

function placeRobot(instant){
  const r = $("#robot"); if (!r) return; r.hidden = false;
  if (instant) r.style.transition = "none";
  r.style.transform = `translate(${B.col*B.c}px, ${B.l*B.c}px)`;
  r.querySelector(".seta").style.transform = `rotate(${ROT[B.dir]}deg)`;
  if (instant){ r.offsetHeight; r.style.transition = ""; }
}
function trail(l, c){ const el = $(`[data-c="${l},${c}"]`); if (el && !el.querySelector(".trail")) el.insertAdjacentHTML("beforeend", `<span class="trail"></span>`); }
function status(){
  if (B.semMapa) return;
  const p = [`Passos <b>${B.passos}</b>`];
  if (B.mapa.some(r => /[gfp]/.test(r))) p.push(`Custo <b>${B.custo}</b>`);
  if (B.mapa.some(r => /[abc]/.test(r))) p.push(`Chaves <b>${B.chaves.join(" ") || "—"}</b>`);
  $("#bstatus").innerHTML = p.join(" · ");
}
const wait = ms => new Promise(r=>setTimeout(r, ms));
function boom(l, c){ const b = document.createElement("div"); b.className="boom"; b.style.left = c*B.c+"px"; b.style.top = l*B.c+"px"; $("#board").appendChild(b); }
const LETRA = { N:"N", L:"L", S:"S", O:"O" };
async function animate(eventos){
  $("#board").style.setProperty("--spd", speed+"ms");
  for (const ev of eventos){
    if (abort) return false;
    const [tipo, a, b, d] = ev.slice(1).split(" ");
    let pausa = speed;
    if (tipo === "pos"){ B.l = +a; B.col = +b; placeRobot(true); trail(B.l, B.col); pausa = speed*0.5; }
    else if (tipo === "move"){ trail(B.l, B.col); B.l = +a; B.col = +b; B.dir = LETRA[d] || B.dir; B.passos++; const ch = B.mapa[B.l][B.col]; B.custo += CUSTO[ch] || 1; placeRobot(); }
    else if (tipo === "turn"){ B.dir = LETRA[a] || B.dir; placeRobot(); pausa = speed*0.6; }
    else if (tipo === "key"){ const k = $(`.kk[data-key="${a},${b}"]`); if (k) k.classList.add("got"); B.chaves.push(d); document.querySelectorAll(`.door[data-door="${d}"]`).forEach(x=>x.classList.add("open")); pausa = speed*0.5; }
    else if (tipo === "crash"){ B.dir = LETRA[d] || B.dir; placeRobot(); const r = $("#robot"); r.classList.remove("crash"); r.offsetHeight; r.classList.add("crash"); boom(+a, +b); }
    status();
    await wait(pausa);
  }
  return true;
}

/* ---------------- execução ---------------- */
function fonte(m, code, teste){
  return DADOS.header + code + "\n" + (m.estacao || "") + "\n" + (m.oculto || "") + "\npublic class Main {\n    public static void main(String[] args) throws Exception {\n" + teste + "\n    }\n}\n";
}
function explicar(err, linhasAluno){
  const naLinha = err.line && err.line <= linhasAluno ? ` (linha ${err.line})` : "";
  if (err.kind === "compile") return { msg: `Erro de compilação${naLinha}: ${err.msg}`, hint: err.line && err.line > linhasAluno ? "O erro apareceu quando o teste do conselho tentou usar o seu código. Confira os nomes das classes e métodos pedidos na ordem da corte (maiúsculas contam) e os tipos dos parâmetros." : "Confira ; no fim das instruções, as chaves { } e os nomes pedidos na ordem da corte." };
  if (err.kind === "exception"){
    let hint = naLinha ? "Uma exceção escapou do seu código sem ser tratada." : "Uma exceção escapou durante o teste. Leia a mensagem: ela costuma dizer exatamente o que falhou.";
    if (err.cls === "NullPointerException") hint = "Algum valor estava null. Confira se os atributos e coleções foram inicializados.";
    else if (/IndexOutOfBounds/.test(err.cls)) hint = "Uma posição fora da lista, do array ou da String foi acessada.";
    else if (err.cls === "UnsupportedOperationException") hint = "Você tentou alterar uma coleção imutável (como as de List.of ou toList()). Faça uma cópia com new ArrayList<>(...) antes de mexer.";
    else if (err.cls === "StackOverflowError") hint = "A recursão não parou. Confira o caso base.";
    else if (err.cls === "ConcurrentModificationException") hint = "A coleção foi alterada enquanto era percorrida. Percorra uma cópia ou use um Iterator.";
    return { msg: (err.java || err.msg).replace(/^Exception in thread "main" /, "") + naLinha, hint };
  }
  if (err.kind === "timeout") return { msg: "O código demorou demais e o conselho interrompeu.", hint: "Algum laço nunca termina, ou o algoritmo visita estados demais." };
  return { msg: err.msg || "erro inesperado", hint: "" };
}
function mostrarSaida(linhas, esperadas){
  const box = $("#saidaBox"); if (!box) return;
  const n = Math.max(linhas.length, esperadas.length);
  let html = ""; let errou = false;
  for (let i = 0; i < n; i++){
    const g = linhas[i], e = esperadas[i];
    if (g === undefined) { html += `<span class="bad">✗ (faltou) ${esc(e)}</span>`; errou = true; continue; }
    const ok = g === e; if (!ok) errou = true;
    html += `<span class="${ok ? "ok" : "bad"}">${ok ? "✓" : "✗"} ${esc(g)}</span>`;
  }
  box.innerHTML = `<div class="lbl">Saída do seu código</div><pre class="saida">${html || "<span>(nada foi impresso)</span>"}</pre>`;
}
async function runAll(){
  if (running) return;
  const m = MISSOES[cur], code = codeEl.value;
  codeEl.blur(); fbEl.innerHTML = "";
  for (const [re, msg] of (m.forbid||[])) if (new RegExp(re).test(code)) return fail(msg);
  if (/\bpublic\s+static\s+void\s+main\b/.test(code)) return fail("Não escreva o método main: o conselho cria o Main e chama as suas classes.");
  running = true; abort = false; attempts++;
  const myRun = ++runId;
  $("#run").hidden = true; $("#stop").hidden = false;
  mapStatus = m.casos.map(()=>null); renderMaps();
  if (isPhone()) $(".boardcard").scrollIntoView({behavior:"smooth", block:"start"});
  const linhasAluno = code.split("\n").length;
  let allOk = true;
  for (let k = 0; k < m.casos.length; k++){
    shownMap = k; renderMaps(); resetBoard();
    await wait(k>0 ? 250 : 40);
    if (myRun !== runId) return;
    const caso = m.casos[k];
    const r = MiniJava.runJava(fonte(m, code.replace(/^\s*public\s+(?=(final\s+|abstract\s+|sealed\s+)*(class|interface|enum|record)\b)/gm, ""), caso.teste), { noMoreInput: true });
    const todas = (r.out || "").split("\n"); if (todas[todas.length-1] === "") todas.pop();
    const eventos = todas.filter(l => l.startsWith("@")), linhas = todas.filter(l => !l.startsWith("@"));
    const esperadas = caso.esperado.split("\n").filter(l => l !== "" || true); if (esperadas[esperadas.length-1] === "") esperadas.pop();
    const espTexto = esperadas.filter(l => !l.startsWith("@"));
    if (r.error && r.error.kind === "compile"){ allOk = false; mapStatus[k] = false; renderMaps(); const { msg, hint } = explicar(r.error, linhasAluno); fail(msg, hint); break; }
    const done = (!B.semMapa) ? await animate(eventos) : true;
    if (myRun !== runId) return;
    if (B.semMapa) mostrarSaida(linhas, espTexto);
    else $("#note").textContent = linhas.join(" · ");
    if (!done){ allOk = false; fbEl.innerHTML = `<div class="feedback bad"><b>Interrompido</b>Ajuste o código e apresente de novo.</div>`; break; }
    const pre = m.casos.length > 1 ? `Teste ${k+1}: ` : "";
    if (r.error){ const { msg, hint } = explicar(r.error, linhasAluno); mapStatus[k] = false; renderMaps(); allOk = false; fail(pre + msg, hint); break; }
    const i = espTexto.findIndex((e, j) => linhas[j] !== e);
    if (i >= 0 || linhas.length !== espTexto.length){
      const j = i >= 0 ? i : espTexto.length;
      mapStatus[k] = false; renderMaps(); allOk = false;
      fail(`${pre}a saída não bateu na linha ${j+1}.`, "", `O conselho esperava:\n  ${espTexto[j] === undefined ? "(nenhuma linha a mais)" : espTexto[j]}\nSeu código imprimiu:\n  ${linhas[j] === undefined ? "(nada)" : linhas[j]}`);
      break;
    }
    mapStatus[k] = true; renderMaps();
    await wait(B.semMapa ? Math.max(700, speed*5) : 300);
  }
  running = false; $("#run").hidden = false; $("#stop").hidden = true;
  if (allOk) win(m, code);
}
function stopRun(){ abort = true; running = false; runId++; }
function win(m, code){
  const n = starsFor(m, code), lines = linhasDeCodigo(code);
  const best = Math.max(stars[m.id]||0, n); stars[m.id] = best; store.set("stars", stars); updateStarCount();
  const last = cur === MISSOES.length-1;
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="win" role="dialog" aria-label="Missão concluída"><b>${last?"A princesa está salva!":"Aprovado pela corte"}</b><div class="stars">${starsHtml(n)}</div>
    <span>${lines} linhas de código · meta para 3 estrelas: ${m.par}</span>
    ${n<3?`<span style="color:var(--ink-soft);font-size:.9rem">Funciona! Dá para deixar mais enxuto?</span>`:""}
    <div class="row">${last?`<button class="btn primary" data-lv>Ver missões</button>`:`<button class="btn primary" data-next>Próxima missão →</button>`}<button class="btn" data-stay>Ficar aqui</button></div></div>`;
  $("#stage").appendChild(ov);
  const nx = ov.querySelector("[data-next]"); if (nx) nx.onclick = ()=>openLevel(cur+1);
  const lv = ov.querySelector("[data-lv]"); if (lv) lv.onclick = showLevels;
  ov.querySelector("[data-stay]").onclick = ()=>ov.remove();
  fbEl.innerHTML = `<div class="feedback ok"><b>Missão concluída com ${n} estrela${n>1?"s":""}</b>${m.casos.length>1?`O código passou nos ${m.casos.length} testes do conselho.`:"O conselho aprovou o código."}</div>`;
  $("#mission .goal").lastElementChild.innerHTML = `Melhor: <b style="color:var(--star)">${"★".repeat(best)}</b>`;
}
function fail(msg, hint, cmp){
  const m = MISSOES[cur];
  fbEl.innerHTML = `<div class="feedback bad"><b>O conselho recusou</b><span>${esc(msg)}</span>${cmp?`<div class="cmp">${esc(cmp)}</div>`:""}${hint?`<span style="color:var(--ink)">${esc(hint)}</span>`:""}
    <div class="row"><button class="btn" data-hint>Ver dica</button>${attempts>=2?`<button class="btn" data-sol>Ver solução</button>`:""}</div><div data-extra></div></div>`;
  fbEl.querySelector("[data-hint]").onclick = ()=> fbEl.querySelector("[data-extra]").innerHTML = `<div class="hint">${esc(m.hint)}</div>`;

  if (sb) sb.onclick = ()=>{
    const box = fbEl.querySelector("[data-extra]");

  };

/* ---------------- editor ---------------- */
function syncGutter(){
  if (!codeEl) return;
  const n = codeEl.value.split("\n").length;
  gutterEl.textContent = Array.from({length:n},(_,i)=>i+1).join("\n");
  codeEl.style.height = "auto"; codeEl.style.height = codeEl.scrollHeight+"px";
  const pw = codeEl.parentElement.clientWidth-42;
  codeEl.style.width = "auto"; codeEl.style.width = Math.max(pw, codeEl.scrollWidth)+"px";
}
function insert(t, back=0){
  codeEl.setRangeText(t, codeEl.selectionStart, codeEl.selectionEnd, "end");
  if (back){ const p = codeEl.selectionStart-back; codeEl.setSelectionRange(p,p); }
  codeEl.dispatchEvent(new Event("input"));
}
function newline(){
  const v = codeEl.value, s = codeEl.selectionStart;
  const line = v.slice(v.lastIndexOf("\n", s-1)+1, s);
  const ind = line.match(/^ */)[0];
  if (/\{\s*$/.test(line)){
    if (v[codeEl.selectionEnd] === "}"){ insert("\n" + ind + "    " + "\n" + ind, ind.length + 1); return; }
    insert("\n" + ind + "    "); return;
  }
  insert("\n"+ind);
}
function dedent(){
  const v = codeEl.value, s = codeEl.selectionStart, ls = v.lastIndexOf("\n", s-1)+1;
  const sp = v.slice(ls).match(/^ {1,4}/);
  if (sp){ codeEl.setRangeText("", ls, ls+sp[0].length, "end"); const p = Math.max(ls, s-sp[0].length); codeEl.setSelectionRange(p,p); codeEl.dispatchEvent(new Event("input")); }
}
function setupEditor(){
  codeEl.addEventListener("input", ()=>{ syncGutter(); saveCode(); });
  codeEl.addEventListener("keydown", e=>{
    const v = codeEl.value, s = codeEl.selectionStart, en = codeEl.selectionEnd;
    if ((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); runAll(); return; }
    if (e.key==="Tab"){ e.preventDefault(); e.shiftKey ? dedent() : insert("    "); return; }
    if (e.key==="Enter" && !e.isComposing){ e.preventDefault(); newline(); return; }
    if (e.key==="}" && s===en){
      const before = v.slice(v.lastIndexOf("\n", s-1)+1, s);
      if (/^ {4,}$/.test(before)){ e.preventDefault(); codeEl.setRangeText("}", s-4, s, "end"); codeEl.dispatchEvent(new Event("input")); return; }
    }
    if (e.key==="Backspace" && s===en){
      const before = v.slice(v.lastIndexOf("\n", s-1)+1, s);
      if (before.length && /^ +$/.test(before)){ e.preventDefault(); const k = (before.length-1)%4+1; codeEl.setRangeText("", s-k, s, "end"); codeEl.dispatchEvent(new Event("input")); }
    }
  });
  syncGutter();
}
const KEYS = [["⇥", "tab"], ["⇤", "dedent"], [";", ";"], ["{ }", "{}", 1], ["( )", "()", 1], ["\" \"", "\"\"", 1], ["<>", "<>", 1], ["[ ]", "[]", 1], ["->", " -> "], ["::", "::"], [".", "."], ["!", "!"], ["&&", " && "], ["==", "=="], ["return", "return "], ["new", "new "], ["this.", "this."], ["static", "static "], ["record", "record "], ["switch", "switch () {}", 4], ["case", "case  -> ", 4], ["for", "for () {}", 4], ["↵", "enter"]];
function setupKeys(){
  const kb = $("#keys"); kb.innerHTML = "";
  KEYS.forEach(([label,val,back])=>{
    const b = document.createElement("button"); b.type="button"; b.textContent=label;
    b.setAttribute("aria-label", val==="tab"?"Recuar":val==="dedent"?"Desfazer recuo":val==="enter"?"Nova linha":"Inserir "+val.trim());
    b.addEventListener("pointerdown", e=>e.preventDefault());
    b.onclick = ()=>{ if (document.activeElement!==codeEl) codeEl.focus();
      if (val==="tab") insert("    "); else if (val==="dedent") dedent(); else if (val==="enter") newline(); else insert(val, back||0); };
    kb.appendChild(b);
  });
}

let lastW = window.innerWidth;
window.addEventListener("resize", ()=>{
  if (Math.abs(window.innerWidth - lastW) < 40) return;
  lastW = window.innerWidth;
  if (cur!==null && !running){ resetBoard(); syncGutter(); }
});

(function(){
  updateStarCount();
  const c = store.get("cur", null);
  if (c!==null && MISSOES[c] && unlocked(c)) openLevel(c); else showLevels();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
